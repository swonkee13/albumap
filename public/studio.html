  .vtile .vmic svg{width:11px;height:11px}
  .vtile .vmic.muted{color:var(--accent)}
  .call-controls{display:flex;align-items:center;justify-content:center;gap:11px}
  .cctl{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);color:var(--txt);cursor:pointer;display:grid;place-items:center;transition:.14s}
  .cctl:hover{background:var(--hover)}
  .cctl svg{width:18px;height:18px}
  .cctl.off{background:var(--accent);border-color:var(--accent);color:#fff}
  .cctl.leave{background:#e0322a;border-color:#e0322a;color:#fff}
  .cctl.leave:hover{background:#c72821}
  @media(max-width:1000px){.callbar,.callbar.open{left:16px;right:16px}}

  /* =====================================================================
     MOBILE / TABLET SHELL  (≤1024px).  Desktop (≥1025px) is untouched:
     these controls are display:none until the media query turns them on.
     ===================================================================== */
  .hamburger{display:none;width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,.4);border:none;color:var(--txt);place-items:center;cursor:pointer;flex:none}
  .hamburger svg{width:20px;height:20px}
  .brand-mark{display:none;height:24px;width:auto;max-width:150px;object-fit:contain;flex:none;cursor:pointer}
  .mobile-tabs{display:none}
  .drawer-scrim{display:none}

  @media(max-width:1024px){
    /* release the desktop fixed-height shell so the WINDOW scrolls naturally */
    html,body{height:auto;min-height:100%;overflow-x:hidden;overflow-y:visible}
    .app{display:block;height:auto;min-height:100vh;padding:0;gap:0;overflow:visible}
    .main{border-radius:0;border:none;min-height:100vh;display:block;overflow:visible}
    .scroll{overflow:visible;flex:none;height:auto}
    .sidebar{position:fixed;top:0;left:0;bottom:0;width:290px;max-width:86vw;z-index:130;border-radius:0;border:none;border-right:1px solid var(--line);transform:translateX(-104%);transition:transform .26s cubic-bezier(.4,0,.2,1);box-shadow:0 0 60px rgba(0,0,0,.6)}
    body.drawer-open .sidebar{transform:translateX(0)}
    .drawer-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);z-index:125;opacity:0;pointer-events:none;transition:opacity .26s}
    body.drawer-open .drawer-scrim{opacity:1;pointer-events:auto}
    /* topbar → two rows: [☰ logo … 🔔] then breadcrumbs full-width below */
    .hamburger{display:grid}
    .brand-mark{display:block}
    .topbar{padding:10px 13px 9px;gap:10px;flex-wrap:wrap;row-gap:9px}
    .navbtns{display:none}
    .crumbs{order:10;width:100%;font-size:12.5px;flex-wrap:wrap;white-space:normal;overflow:visible;line-height:1.4}
    /* content: tighter, and clear the bottom tab bar */
    .content{padding:14px 16px calc(84px + env(safe-area-inset-bottom))}
    .view-title{font-size:26px!important}
    .ws-head .view-title{font-size:24px!important}
    /* the desktop studio-call dock is desktop-only (mobile = read & listen) */
    .callbar{display:none!important}
    /* galleries + forms breathe on a phone */
    .slot-grid{grid-template-columns:repeat(3,1fr)!important}
    /* artist + album cards → compact single-column list rows */
    .gallery{grid-template-columns:1fr;gap:10px;margin-top:16px}
    .gallery .g-card{display:grid;grid-template-columns:60px 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;padding:14px 16px;min-height:0}
    .gallery .g-card .art{grid-row:1/3;grid-column:1;width:60px;height:60px;aspect-ratio:1;margin:0;box-shadow:none}
    .gallery .g-card .art.round{border-radius:50%}
    .gallery .g-card .art .ph{font-size:20px}
    .gallery .g-card .gt{grid-column:2;grid-row:1;align-self:end;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .gallery .g-card .gs{grid-column:2;grid-row:2;align-self:start}
    /* card actions are always visible on touch (no hover) + centered right */
    .gallery .g-card:not(.g-add){padding-right:100px}
    .gallery .g-card .card-edit,.gallery .g-card .card-archive{opacity:1;top:50%;transform:translateY(-50%);width:36px;height:36px}
    .gallery .g-card .card-edit{right:12px}
    .gallery .g-card .card-archive{right:56px}
    /* the "New artist/album" tile becomes a matching add-row */
    .gallery .g-add{display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:flex-start!important;gap:14px;min-height:0!important;padding:18px 16px!important}
    .gallery .g-add svg{width:24px!important;height:24px!important;flex:none}
    .gallery .g-add>div{margin-top:0!important}
    /* dashboard sections stack single-column (media sections keep their own grid) */
    .dash-grid{grid-template-columns:1fr}
    /* waveform bars must shrink to fit the card, not overflow it */
    .mtrack .wave .bar{min-width:0}
    .modal{width:96vw;max-width:96vw;margin:0}
    /* bottom tab bar */
    .mobile-tabs{position:fixed;left:0;right:0;bottom:0;z-index:120;background:rgba(18,18,21,.94);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;align-items:stretch;padding-bottom:env(safe-area-inset-bottom)}
    .mtab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--txt-3);font-size:10px;font-weight:600;cursor:pointer;padding:9px 2px 8px;position:relative}
    .mtab svg{width:22px;height:22px}
    .mtab.active{color:var(--accent-hi)}
    .mtab.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
    /* topbar grid shortcut is redundant with the bottom Grid tab */
    .qn-grid{display:none!important}
    /* dashboard hero → stacked & centered */
    .dash-hero{flex-direction:column;align-items:stretch;gap:12px;padding:6px 0 16px}
    .hero-cover-wrap{margin:2px auto 12px}
    .hero-cover{width:min(74vw,300px)!important;height:min(74vw,300px)!important;border-radius:20px}
    .hero-cover .hc-ph{font-size:112px!important}
    .hero-logo-badge{width:min(26vw,104px)!important;height:min(26vw,104px)!important;left:-12px!important;bottom:-12px!important}
    .hero-meta{padding:0;text-align:center;flex:none}
    .hero-meta .eyebrow{justify-content:center}
    .band-name{white-space:normal!important;font-size:26px!important;text-align:center;margin:6px 0 12px}
    .hero-sub{justify-content:center;flex-wrap:wrap}
    .hero-actions{justify-content:center;flex-wrap:wrap;gap:10px}
    .member-caption{justify-content:center}
    .hero-gauges{margin:12px 0 0!important;justify-content:center;width:100%}
    .hg-grid{justify-content:center;max-width:100%;gap:8px}
    /* ---- mobile recording grid (song-centric checklist) ---- */
    .mg-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
    .mg-toolbar .ghost-btn{padding:8px 13px;font-size:12.5px}
    .mg-songs{display:flex;gap:8px;overflow-x:auto;padding:0 0 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .mg-songs::-webkit-scrollbar{display:none}
    .mg-chip{flex:none;padding:9px 15px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--txt-2);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
    .mg-chip.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent-hi)}
    .mg-songhead{display:flex;align-items:center;gap:12px;padding:4px 2px 14px}
    .mg-shl{flex:1;min-width:0}
    .mg-songname{font-family:'Poppins';font-weight:700;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .mg-songmeta{font-size:11.5px;color:var(--txt-3);font-family:'JetBrains Mono';margin-top:2px}
    .mg-assignall{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--txt-2);font-size:12.5px;font-weight:600;cursor:pointer;flex:none}
    .mg-assignall svg{width:15px;height:15px}
    .mg-list{display:flex;flex-direction:column;gap:9px}
    /* the row itself is NOT tappable — only the assign icon + status button are */
    .mg-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line-soft)}
    .mg-inst{flex:1;min-width:0;font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    /* assignee tap target — bigger, reads as a button */
    .mg-assign{flex:none;min-width:52px;height:48px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line-soft);color:var(--txt-3);cursor:pointer;border-radius:12px;padding:0 8px;-webkit-tap-highlight-color:transparent;transition:.12s}
    .mg-assign:active{background:var(--card-hi)}
    .mg-assign.has{border-color:var(--line)}
    .mg-assign>svg{width:24px;height:24px}
    .mg-assign .cell-avstack{position:static;display:inline-flex}
    .mg-assign .cell-av{position:static}
    /* status tap target — bigger pill */
    .mg-statusbtn{flex:none;background:none;border:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .mg-statusbtn:active{transform:scale(.96)}
    .mg-pill{display:inline-flex;align-items:center;gap:7px;padding:12px 18px;border-radius:24px;font-size:14px;font-weight:700;min-width:132px;justify-content:center}
    .mg-pill svg{width:15px;height:15px}
    .mg-pill .mark,.mg-pill>div{width:auto;height:auto}
    .mg-pill.empty{background:transparent;border:1.5px dashed #3a3a42;color:var(--txt-3);font-weight:600}
    .mg-pill.na{background:transparent;border:1.5px solid var(--line);color:var(--txt-3)}
    .mg-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;padding:0 2px}
    .mg-lg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--txt-3)}
    .mg-dot{width:13px;height:13px;border-radius:4px;border:1.5px solid;display:inline-block;flex:none}
    /* assign menu → bottom sheet on mobile */
    .assign-menu.am-sheet{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));top:auto!important;transform:none!important;width:auto;max-width:none;max-height:72vh;border-radius:18px;padding:8px;box-shadow:0 -10px 50px rgba(0,0,0,.6)}
    .assign-menu.am-sheet .am-head{padding:12px 12px 8px}
    .assign-menu.am-sheet .am-row{padding:13px 12px;font-size:15px;border-radius:12px}
    .assign-menu.am-sheet .am-box{width:26px;height:26px}
    .assign-menu.am-sheet .cell-av{width:28px!important;height:28px!important}
    .assign-menu.am-sheet .am-done{padding:14px;font-size:15px}
    /* ---- mobile song player (listen-first) ---- */
    .mtrack{display:block;padding:14px 14px 12px;border-radius:14px}
    .mtrack-top{display:flex;align-items:center;gap:8px;margin-bottom:13px}
    .mtrack-titles{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
    .mtrack-titles .track-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .mtrack-titles .track-file{font-size:11px;color:var(--txt-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .mtrack .track-rename{opacity:1;flex:none;width:34px;height:34px}
    .mtrack .track-rename svg{width:16px;height:16px}
    .mtrack-player{display:flex;align-items:center;gap:14px}
    .mtrack .play-btn{width:54px;height:54px;flex:none;border-radius:50%}
    .mtrack .play-btn svg{width:24px;height:24px}
    .mtrack-wavewrap{flex:1;min-width:0}
    .mtrack .scrub{width:100%;margin:0}
    .mtrack .wave{height:46px}
    .mtrack-meta{font-family:'JetBrains Mono';font-size:11px;color:var(--txt-3);margin-top:7px}
    .mtrack .label-bar{margin-top:13px}
    .mtrack-actions{display:flex;gap:4px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line-soft);justify-content:flex-end}
    .mtrack-actions .ico-btn{width:40px;height:40px}
    .mtrack-actions .ico-btn svg{width:19px;height:19px}
    /* comment feed + composer — emphasized */
    .track-cmts{margin-top:4px}
    .track-cmts .cmt-av{width:32px;height:32px}
    .track-cmts .ctext{font-size:14px}
    .tc-add{gap:8px;margin-top:10px}
    .tc-add input{padding:13px 15px;font-size:14.5px;border-radius:12px}
    .tc-add .ico-btn{width:46px;height:46px;flex:none;background:var(--accent);color:#fff;border-radius:12px}
    .tc-add .ico-btn svg{width:19px;height:19px}
    /* lyrics / notes — bigger, easier to read & write */
    .zone-head .zh-t{font-size:14px}
    .lyrics-area,.notes-area{min-height:130px;font-size:14.5px;line-height:1.55;padding:14px}
    /* de-emphasize upload on mobile (read & listen, not upload) */
    .dropzone.slim{padding:13px}
    .dropzone.slim .big{font-size:13px}
    .zone{border-radius:14px}
    .zone-body{padding:14px}
    /* ---- mobile player (vertical album playlist) ---- */
    .mseq-now{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line-soft);border-radius:16px;padding:14px}
    .mseq-play{width:58px;height:58px;flex:none;border-radius:50%}
    .mseq-play svg{width:24px;height:24px}
    .mseq-nowinfo{flex:1;min-width:0}
    .mseq-nowinfo .now{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mseq-nowinfo .now .swatch{width:11px;height:11px;border-radius:50%;flex:none}
    .mseq-nowinfo .sub2{font-size:11.5px;color:var(--txt-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mseq-times{display:flex;align-items:center;gap:10px;margin:12px 2px 4px;font-size:11px;color:var(--txt-3)}
    .mseq-bar{flex:1;height:5px;border-radius:3px;background:var(--grey);overflow:hidden}
    .mseq-fill{height:100%;width:0;background:var(--accent);border-radius:3px}
    .mseq-tools{display:flex;gap:8px;margin:12px 0 14px}
    .mseq-tools .ghost-btn{padding:8px 13px;font-size:12.5px}
    .mseq-list{display:flex;flex-direction:column;gap:7px}
    .mseq-row{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:13px;background:var(--card);border:1px solid var(--line-soft)}
    .mseq-row.current{border-color:var(--accent);background:var(--accent-dim)}
    .mseq-row.no-audio{opacity:.6}
    .mseq-rowplay{width:40px;height:40px;flex:none;border-radius:50%;border:none;background:var(--panel-2);color:var(--accent-hi);display:grid;place-items:center;cursor:pointer}
    .mseq-row.current .mseq-rowplay{background:var(--accent);color:#fff}
    .mseq-rowplay svg{width:17px;height:17px;margin-left:1px}
    .mseq-num{font-family:'JetBrains Mono';font-size:12px;color:var(--txt-3);flex:none;width:22px}
    .mseq-sw{width:10px;height:10px;border-radius:3px;flex:none}
    .mseq-nm{flex:1;min-width:0;display:flex;flex-direction:column}
    .mseq-name{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mseq-na{font-size:10.5px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.05em}
    .mseq-dur{font-family:'JetBrains Mono';font-size:12px;color:var(--txt-2);flex:none}
    .mseq-mv{display:inline-flex;flex-direction:column;gap:2px;flex:none}
    .mseq-mv button{width:28px;height:20px;border:none;background:transparent;color:var(--txt-3);display:grid;place-items:center;cursor:pointer;border-radius:5px}
    .mseq-mv button:active{background:var(--hover);color:var(--txt)}
    .mseq-mv svg{width:15px;height:15px}
    .mseq-x{width:30px;height:30px;flex:none;border:none;background:transparent;color:var(--txt-3);display:grid;place-items:center;cursor:pointer;border-radius:7px}
    .mseq-x svg{width:15px;height:15px}
  }
  @media(max-width:640px){
    .slot-grid{grid-template-columns:repeat(2,1fr)!important}
    .gallery{grid-template-columns:1fr;gap:14px}
    .content{padding:12px 13px calc(84px + env(safe-area-inset-bottom))}
    .view-title{font-size:23px!important}
    /* song-list collapsed header: drop the inline progress bar so the title +
       meta have room (the % still shows in the meta line) */
    .idea-song[data-song] .idea-head,.idea-song[data-bank] .idea-head{gap:10px;padding:14px 12px}
    .idea-song[data-song] .idea-head .pbar{display:none}
    .idea-song[data-song] .idea-title,.idea-song[data-bank] .idea-title{font-size:15.5px}
    .bank-sec-title{font-size:17px}
    .bank-sec-sub{font-size:11.5px}
    .bank-sec-ic{width:34px;height:34px}
    .ws-sub{font-size:13px}
  }

  /* full-screen image viewer (invoked on mobile; hidden until shown) */
  .img-viewer{position:fixed;inset:0;z-index:200;background:rgba(8,8,10,.975);backdrop-filter:blur(6px);display:none;flex-direction:column}
  .img-viewer.show{display:flex}
  .img-viewer .iv-top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px}
  .img-viewer .iv-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.09);border:none;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
  .img-viewer .iv-btn svg{width:20px;height:20px}
  .img-viewer .iv-label{flex:1;text-align:center;color:#fff;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .img-viewer .iv-stage{flex:1;display:grid;place-items:center;padding:8px 10px 24px;min-height:0;touch-action:pan-y}
  .img-viewer .iv-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .img-viewer .iv-nav{position:fixed;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.11);border:none;color:#fff;display:grid;place-items:center;cursor:pointer}
  .img-viewer .iv-nav.prev{left:10px}
  .img-viewer .iv-nav.next{right:10px}
  .img-viewer .iv-nav svg{width:22px;height:22px}
  .img-viewer .iv-count{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:#fff;font-family:'JetBrains Mono';font-size:12px;background:rgba(0,0,0,.55);padding:5px 13px;border-radius:20px}
  /* styled dialog (alert / confirm / prompt) */
  .ui-dialog-bg{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);display:none;place-items:center;padding:22px}
  .ui-dialog-bg.show{display:grid}
  .ui-dialog{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 24px 70px rgba(0,0,0,.6);padding:22px 22px 18px;animation:uidPop .16s ease}
  @keyframes uidPop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  .uid-title{font-family:'Poppins';font-weight:700;font-size:17px;margin-bottom:8px}
  .uid-msg{font-size:13.5px;color:var(--txt-2);line-height:1.55;white-space:pre-line}
  .uid-input{width:100%;margin-top:14px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--txt);font-size:14px;outline:none}
  .uid-input:focus{border-color:var(--accent)}
  .uid-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
  .uid-btn{padding:10px 18px;border-radius:10px;font-weight:600;font-size:13.5px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--txt-2);transition:.12s}
  .uid-btn.cancel:hover{background:var(--hover);color:var(--txt)}
  .uid-btn.ok{background:var(--accent);border-color:var(--accent);color:#fff}
  .uid-btn.ok:hover{background:var(--accent-hi)}
  .uid-btn.ok.danger{background:#e0322a;border-color:#e0322a}
  .uid-btn.ok.danger:hover{background:#c72821}
</style>
</head>
<body>
<div class="app">

function assignAvatarHTML(al,name,sz){const m=memberByName(al,name);const color=avColor(name,(m&&m.color)||colorForName(name));const inner=avInner(name,(m&&m.initials)||initials(name));return `<span class="cell-av" style="width:${sz}px;height:${sz}px;background:${color}" title="${esc(name)}">${inner}</span>`;}
// Overlapping avatar stack for a cell (max shown, then +N).
function assignStackHTML(al,names,sz){if(!names||!names.length)return '';const max=3;const show=names.slice(0,max);const extra=names.length-show.length;let h='<span class="cell-avstack">'+show.map(n=>assignAvatarHTML(al,n,sz)).join('');if(extra>0)h+=`<span class="cell-av more" style="width:${sz}px;height:${sz}px" title="${esc(names.join(', '))}">+${extra}</span>`;return h+'</span>';}
function colorForName(name){const P=["#FF4D1C","#2E8B8B","#B4644A","#4EA8E8","#B06BFF","#3ECF8E","#F5A623","#FF6B9D"];let h=0;name=String(name||'');for(let i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;return P[h%P.length];}
function initials(name){return String(name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'?';}
// Progress fraction 0..1 for a status id (null = N/A / excluded).
function statusProgress(al,id){const sts=albumStatuses(al);const st=(id!=null)?sts.find(x=>x.id===id):null;if(st&&st.na)return null;const nonNA=sts.filter(x=>!x.na);if(!nonNA.length)return 0;let rank=st?nonNA.findIndex(x=>x.id===id):0;if(rank<0)rank=0;return nonNA.length>1?rank/(nonNA.length-1):(rank===nonNA.length-1?1:0);}
function songStats(s,al){const insts=albumInstruments(al);const nonNA=albumStatuses(al).filter(x=>!x.na);const lastId=nonNA.length?nonNA[nonNA.length-1].id:null;let denom=0,sum=0,done=0;for(const inst of insts){const id=cellStatus(s,inst);const p=statusProgress(al,id);if(p===null)continue;denom++;sum+=p;if((id||albumStatuses(al)[0].id)===lastId)done++;}return{denom,sum,done};}
function songProg(s,al){const st=songStats(s,al);return st.denom?Math.round(st.sum/st.denom*100):0;}
function albumProg(al){if(!al.songs.length)return 0;return Math.round(al.songs.reduce((a,s)=>a+songProg(s,al),0)/al.songs.length);}
function albumParts(al){let done=0,total=0;al.songs.forEach(s=>{const st=songStats(s,al);done+=st.done;total+=st.denom;});return{done,total};}

const HERO_METRICS={
  recording:{label:'Recording',color:'#FF4D1C'},
  artwork:{label:'Artwork',color:'#4EA8E8'},
  photos:{label:'Photos',color:'#B06BFF'},
  logos:{label:'Logos',color:'#2ED3C6'},
  merch:{label:'Merch',color:'#FF6B9D'},
  overall:{label:'Overall',color:'#3ECF8E'}
};
const HERO_ORDER=['recording','artwork','photos','logos','merch','overall'];
// Hero dials are owner-controlled and persisted on the album (consistent across
// browsers/users). Configured from Profile & Settings.
function heroKeys(al){const k=(al&&Array.isArray(al.heroKeys))?al.heroKeys.filter(x=>HERO_METRICS[x]):null;return (k&&k.length)?k:['recording'];}
function saveHeroKeys(al,keys){if(!al)return;al.heroKeys=keys.length?keys:['recording'];fetch('/api/album',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:al.id,heroKeys:al.heroKeys})}).catch(()=>{});}
function mediaFinalStats(al,kind){const main=mediaMain(al,kind).filter(x=>!x.song);const done=main.filter(x=>x.finalized).length;return {total:main.length,done,pct:main.length?Math.round(done/main.length*100):0};}
function merchFinalStats(al){const items=al.merchItems||[];const done=items.filter(x=>x.finalized).length;return {total:items.length,done,pct:items.length?Math.round(done/items.length*100):0};}
function metricRaw(al,key){
  if(key==='recording'){const p=albumParts(al);return {pct:albumProg(al),sub:`${p.done}/${p.total} parts`,has:al.songs.length>0&&p.total>0};}
  if(key==='artwork'){const s=mediaFinalStats(al,'artwork');return {pct:s.pct,sub:`${s.done}/${s.total} final`,has:s.total>0};}
  if(key==='photos'){const s=mediaFinalStats(al,'photo');return {pct:s.pct,sub:`${s.done}/${s.total} final`,has:s.total>0};}
  if(key==='logos'){const s=mediaFinalStats(al,'logo');return {pct:s.pct,sub:`${s.done}/${s.total} final`,has:s.total>0};}
  if(key==='merch'){const s=merchFinalStats(al);return {pct:s.pct,sub:`${s.done}/${s.total} final`,has:s.total>0};}
  return null;
}
function metricValue(al,key,keys){
  if(key==='overall'){const others=(keys||[]).filter(k=>k!=='overall');const src=others.length?others:['recording','artwork','photos','logos','merch'];
    const vals=src.map(k=>metricRaw(al,k)).filter(v=>v&&v.has);const pct=vals.length?Math.round(vals.reduce((a,v)=>a+v.pct,0)/vals.length):0;
    return {pct,sub:`${vals.length} area${vals.length!==1?'s':''}`};}
  const r=metricRaw(al,key);return r?{pct:r.pct,sub:r.sub}:{pct:0,sub:'—'};
}
function gaugeHTML(al,key,keys){const m=metricValue(al,key,keys);const cfg=HERO_METRICS[key];const circ=2*Math.PI*27;
  return `<div class="gauge"><div class="gauge-ring"><svg viewBox="0 0 64 64" width="64" height="64"><circle cx="32" cy="32" r="27" stroke="var(--grey)" stroke-width="5" fill="none"/><circle cx="32" cy="32" r="27" stroke="${cfg.color}" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-m.pct/100)}"/></svg><div class="gauge-pct">${m.pct}%</div></div><div class="gauge-label" style="color:${cfg.color}">${cfg.label}</div><div class="gauge-sub">${m.sub}</div></div>`;
}
function heroGaugesHTML(a,al){const keys=heroKeys(al);
  return `<div class="hero-gauges"><div class="hg-grid">${keys.map(k=>gaugeHTML(al,k,keys)).join('')}</div></div>`;
}
function refreshHeroGauges(){const al=AL();const host=content.querySelector('.hero-gauges');if(host&&al){const tmp=document.createElement('div');tmp.innerHTML=heroGaugesHTML(A(),al);host.replaceWith(tmp.firstElementChild);}}
// Toggle a hero dial for a specific album (configured from Settings).
function toggleHeroKeyFor(albumId,k){

  if(!al||!HERO_METRICS[k])return;

function dashSeq(al){

function activityTarget(text){

  const low=(text||'').replace(/<[^>]+>/g,'').toLowerCase();
  let song=null,bestLen=0;(al.songs||[]).forEach(s=>{const n=(s.t||'').toLowerCase();if(n&&n.length>1&&low.includes(n)&&n.length>bestLen){bestLen=n.length;song=s;}});
  if(/tracklist|reorder/.test(low))return {view:'sequencer',...base};
  if(/artwork/.test(low))return {view:'artwork',...base};
  if(/merch/.test(low))return {view:'merch',...base};
  if(/release date|schedule/.test(low))return {view:'schedule',...base};

function saveProfile(field,value){

function uploadProfilePhoto(){document.getElementById('profileInput').click();}
async function doUploadProfilePhoto(f){
  const localUrl=URL.createObjectURL(f);if(settingsData)settingsData.photo=localUrl;renderSettingsBody();
  try{
    const up=await fetch('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'upload-url',name:f.name})}).then(r=>r.json());

// Real "waiting on": per-member count of assigned parts that aren't finished yet,
// plus how many unfinished parts nobody owns. Driven entirely by assignments.
function computeWaiting(al){
  const ms=inMembers(al);const insts=albumInstruments(al);
  const stats={};ms.forEach(m=>stats[m.name]={name:m.name,color:m.color,initials:m.initials,count:0,insts:{}});
  let unassigned=0;
  al.songs.forEach(s=>insts.forEach(inst=>{
    const p=statusProgress(al,cellStatus(s,inst));if(p===null||p>=1)return; // done or N/A → not blocking
    const who=cellAssignees(s,inst);
    if(who.length){who.forEach(n=>{if(stats[n]){stats[n].count++;stats[n].insts[inst]=1;}});}
    else unassigned++;
  }));
  const rows=ms.map(m=>{const st=stats[m.name];const parts=Object.keys(st.insts);
    const detail=parts.length?parts.slice(0,2).join(', ')+(parts.length>2?' +'+(parts.length-2)+' more':''):'open parts';
    return {name:m.name,color:m.color,initials:m.initials,count:st.count,detail};
  }).filter(r=>r.count>0).sort((a,b)=>b.count-a.count);
  return {rows,unassigned};
}

  al.songs.forEach(s=>{const parts=[];insts.forEach(inst=>{
    const who=cellAssignees(s,inst);if(!who.some(n=>n.trim().toLowerCase()===meName))return;
    const p=statusProgress(al,cellStatus(s,inst));if(p===null||p>=1)return;

  });if(parts.length)out.push({song:s,parts});});

}

  const rows=ms.length?ms.map(m=>{const st=memberCellState(m.name,targets);return `<button class="am-row${st!=='none'?' on':''}" onclick="toggleAssign('${escq(m.name)}')"><span class="cell-av" style="width:22px;height:22px;background:${avColor(m.name,m.color)}">${avInner(m.name,m.initials)}</span><span class="am-name">${esc(m.name)}</span><span class="am-box ${st}">${st==='all'?'✓':st==='some'?'–':''}</span></button>`;}).join(''):`<div class="am-empty">No bandmates in the studio yet — invite members from the album header first.</div>`;

}
function toggleAssign(name){
  const al=AL();const ctx=assignCtx;if(!ctx)return;const targets=assignTargets();if(!targets.length)return;
  const bulk=ctx.scope!=='cell';const add=!targets.every(t=>cellHasMember(t.s,t.inst,name));
  targets.forEach(t=>{const arr=setCellMember(t.s,t.inst,name,add);persistAssignees(t.s.id,t.inst,arr,bulk,name,add);});
  const insts=albumInstruments(al);let text;
  if(ctx.scope==='col'){const inst=insts[ctx.ci];text=add?`added <b>${esc(name)}</b> to <b>${esc(inst)}</b> on every song`:`removed <b>${esc(name)}</b> from every <b>${esc(inst)}</b>`;}
  else if(ctx.scope==='row'){const s=al.songs[ctx.si];text=add?`added <b>${esc(name)}</b> to every part of <b>${esc(s.t)}</b>`:`removed <b>${esc(name)}</b> from <b>${esc(s.t)}</b>`;}
  else{const s=al.songs[ctx.si];const inst=insts[ctx.ci];text=add?`assigned <b>${esc(inst)}</b> on ${esc(s.t)} to <b>${esc(name)}</b>`:`removed <b>${esc(name)}</b> from <b>${esc(inst)}</b> on ${esc(s.t)}`;}
  pushLocalActivity(al,text);
  renderGrid();paintAssignMenu();
}
function clearAssign(){
  const al=AL();const ctx=assignCtx;if(!ctx)return;const targets=assignTargets();const bulk=ctx.scope!=='cell';
  targets.forEach(t=>{if(t.s.assign)delete t.s.assign[t.inst];persistAssignees(t.s.id,t.inst,[],bulk,'',false);});
  const insts=albumInstruments(al);let text;
  if(ctx.scope==='col'){text=`cleared every <b>${esc(insts[ctx.ci])}</b> assignee`;}

  else{const s=al.songs[ctx.si];text=`cleared the assignees for <b>${esc(insts[ctx.ci])}</b> on ${esc(s.t)}`;}

}
function pushLocalActivity(al,text){if(!al)return;if(!Array.isArray(al.activity))al.activity=[];al.activity.unshift({who:(me&&me.name)||'You',color:(me&&me.color)||null,text,time:'just now',at:new Date().toISOString()});}

function setStatusField(i,field,val){const al=AL();const sts=albumStatusesEditable(al);if(!sts[i])return;sts[i][field]=(field==='na')?!!val:val;persistStatuses(al);if(field==='icon'||field==='na')renderStatusList();statusRefresh();}
function moveStatus(i,d){const al=AL();const sts=albumStatusesEditable(al);const j=i+d;if(j<0||j>=sts.length)return;const t=sts[i];sts[i]=sts[j];sts[j]=t;persistStatuses(al);renderStatusList();statusRefresh();}

async function deleteStatus(i){const al=AL();const sts=albumStatusesEditable(al);if(sts.length<=1)return;if(!await uiConfirm('Cells set to this status will show as “not started”.',{title:'Delete this status?',okLabel:'Delete',danger:true}))return;sts.splice(i,1);persistStatuses(al);renderStatusList();statusRefresh();}
async function applyStatusPreset(which){const al=AL();if(!await uiConfirm('Replace the status set with this preset? Existing cell values are kept where the ids match.',{title:'Apply preset',okLabel:'Replace'}))return;
  al.statuses=which==='simple'

/* ---- custom instrument columns ---- */
async function saveInstruments(al,instruments){
  al.instruments=instruments;
  const r=await fetch('/api/instruments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({albumId:al.id,instruments})}).then(r=>r.json()).catch(()=>({ok:false}));
  return r&&r.ok;
}
async function addInstrument(){
  const al=AL();if(!al)return;const name=(await uiPrompt('New instrument / part name','',{title:'Add instrument',placeholder:'e.g. Pedal steel',okLabel:'Add'})||'').trim();if(!name)return;
  const insts=albumInstruments(al).slice();
  if(insts.some(x=>x.toLowerCase()===name.toLowerCase())){uiAlert('That instrument already exists.');return;}
  insts.push(name);await saveInstruments(al,insts);renderGrid();
}
async function renameInstrument(ci){
  const al=AL();const insts=albumInstruments(al).slice();const old=insts[ci];if(old==null)return;
  const name=(await uiPrompt('Rename instrument',old,{title:'Rename instrument'})||'').trim();if(!name||name===old)return;
  if(insts.some((x,i)=>i!==ci&&x.toLowerCase()===name.toLowerCase())){uiAlert('That instrument already exists.');return;}
  insts[ci]=name;
  // move each song's cell data from the old key to the new one
  al.songs.forEach(s=>{if(s.cells&&s.cells[old]!=null){s.cells[name]=s.cells[old];delete s.cells[old];}});
  await fetch('/api/instruments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({albumId:al.id,instruments:insts,rename:{from:old,to:name}})}).catch(()=>{});
  al.instruments=insts;renderGrid();
}
// Reorder a column left/right. Cells + assignments are keyed by instrument name,
// so this is purely a display-order change — just reorder the array and persist.
async function moveInstrument(ci,dir){
  const al=AL();const insts=albumInstruments(al).slice();const j=ci+dir;
  if(j<0||j>=insts.length)return;
  [insts[ci],insts[j]]=[insts[j],insts[ci]];
  al.instruments=insts;renderGrid();
  fetch('/api/instruments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({albumId:al.id,instruments:insts})}).catch(()=>{});
}
async function deleteInstrument(ci){
  const al=AL();const insts=albumInstruments(al).slice();const name=insts[ci];if(name==null)return;
  if(!await uiConfirm(`This clears “${name}” cell data for every song.`,{title:`Delete the “${name}” column?`,okLabel:'Delete',danger:true}))return;
  insts.splice(ci,1);
  al.songs.forEach(s=>{if(s.cells&&s.cells[name]!=null)delete s.cells[name];});
  await fetch('/api/instruments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({albumId:al.id,instruments:insts,remove:name})}).catch(()=>{});
  al.instruments=insts;renderGrid();
}

function stableWave(seed,n){n=n||120;let h=[],s=0;for(let i=0;i<seed.length;i++)s+=seed.charCodeAt(i);let prev=0.4;for(let i=0;i<n;i++){s=(s*9301+49297)%233280;const r=s/233280;const env=Math.pow(Math.sin((i/n)*Math.PI),0.6);const target=(0.12+r*0.88)*(0.35+0.65*env);prev=prev*0.55+target*0.45;h.push(Math.max(.08,Math.min(1,prev)));}return h;}
/* decode real audio into a peak waveform */
async function decodeWaveform(url,n){
  n=n||120;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const buf=await fetch(url).then(r=>r.arrayBuffer());
    const audio=await ctx.decodeAudioData(buf);
    const data=audio.getChannelData(0);
    const block=Math.floor(data.length/n);
    let peaks=[];let max=0;
    for(let i=0;i<n;i++){let p=0;for(let j=0;j<block;j++){const v=Math.abs(data[i*block+j]||0);if(v>p)p=v;}peaks.push(p);if(p>max)max=p;}
    ctx.close();
    return peaks.map(p=>Math.max(.06,max?p/max:0));
  }catch(e){return stableWave(url,n);}
}

function handleAudio(files,target){
  const al=AL();const audio=files.filter(f=>/audio|\.wav|\.mp3|\.m4a|\.aiff/i.test(f.type+f.name));
  if(!audio.length){if(files.length)uiAlert('Drop a WAV, MP3, M4A or AIFF.');return;}
  const isBank=(target==='bank');
  const song=isBank?null:al.songs[target];
  if(!isBank&&!song)return;
  if(!isBank&&song)route.songId=song.id; // keep this song expanded through the re-renders
  audio.forEach(f=>{const fmt=/wav/i.test(f.name)?'wav':/mp3|mpeg/i.test(f.name)?'mp3':/m4a|aiff/i.test(f.name)?'m4a':'mp3';
    const url=URL.createObjectURL(f);const t={id:++uidc,name:f.name,title:'',fmt,note:'uploading…',url,dur:null,at:new Date().toISOString(),labels:[],waveform:stableWave(f.name+f.size,160)};
    if(isBank){al.bank=al.bank||[];al.bank.push(t);}else{song.files.push(t);}
    renderSongsAudio();

async function uploadToR2(f,dest,t){
  try{
    const b1=dest.songId?{songId:dest.songId,name:f.name}:{albumId:dest.albumId,bank:true,name:f.name};
    const up=await fetch('/api/upload-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b1)}).then(r=>r.json());
    if(!up.ok)throw new Error('url');
    const put=await fetch(up.uploadUrl,{method:'PUT',headers:{'Content-Type':up.contentType},body:f});
    if(!put.ok)throw new Error('put');
    const b2=dest.songId?{songId:dest.songId,name:f.name,key:up.key,size:f.size,duration:t.dur}:{albumId:dest.albumId,bank:true,name:f.name,key:up.key,size:f.size,duration:t.dur};
    const meta=await fetch('/api/song-file',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b2)}).then(r=>r.json());
    if(!meta.ok)throw new Error('save');
    t.sid=meta.id;t.note='saved';
    if(t.labels&&t.labels.length)fetch('/api/song-file',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:t.sid,labels:t.labels})}).catch(()=>{});
    if(t.master)fetch('/api/song-file',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:t.sid,master:true})}).catch(()=>{});
    renderSongsAudio();
  }catch(e){t.note='upload failed — check R2 setup';renderSongsAudio();}
}

function togglePlay(id){
  const t=findFile(id);
  if(!t||!t.url){uiAlert('This is a seeded demo row with no real file. Drop a real WAV or MP3 to hear playback.');return;}
  // Same track already loaded → pause/resume in place (keeps the seek position).
  if(curTid===id&&curAudio){
    if(curAudio.paused){curAudio.play().catch(()=>{});setPlayUI(id);}
    else{curAudio.pause();setPlayUI(null);}
    return;
  }
  if(curAudio)curAudio.pause();
  curAudio=new Audio(t.url);curTid=id;
  curAudio.addEventListener('timeupdate',()=>updProg(id));
  curAudio.addEventListener('ended',()=>{setPlayUI(null);resetWaveUI(id);t.seekFrac=0;});
  // Start from a click-seeked point chosen while paused, if any.
  const startFrac=t.seekFrac||0;
  const applySeek=()=>{if(startFrac)try{curAudio.currentTime=startFrac*(curAudio.duration||t.dur||0);}catch(e){}};
  if(curAudio.readyState>=1)applySeek();
  curAudio.addEventListener('loadedmetadata',applySeek,{once:true});
  curAudio.play().catch(()=>{});

}

function updProg(id){if(!curAudio)return;const pct=curAudio.currentTime/(curAudio.duration||1);fillWaveTo(id,pct);const cur=document.querySelector(`[data-cur="${id}"]`);if(cur)cur.textContent=fmtT(curAudio.currentTime);

function saveSeqLayout(){const al=AL();if(!al)return;try{localStorage.setItem(seqLayoutKey(al.id),JSON.stringify(seqSongs.map(s=>s.placeholder?{ph:true,id:s.id,name:s.name,color:s.color,dur:s.dur}:{id:s.id})));}catch(e){}}

function buildSeqSongs(al){
  const base=al.songs.map((s,i)=>{const f=pickPlayFile(s);return {id:s.id,name:s.t,dur:(f&&f.dur)||s.dur||210,color:SONG_COLORS[i%SONG_COLORS.length],url:f?f.url:null};});
  const layout=loadSeqLayout(al.id);
  if(!layout||!layout.length)return base;
  const byId={};base.forEach(b=>byId[b.id]=b);const out=[],used=new Set();
  layout.forEach(tok=>{
    if(tok&&tok.ph)out.push({id:tok.id,name:tok.name||'Placeholder',dur:tok.dur||PH_DUR,color:tok.color||PH_COLORS[0],url:null,placeholder:true});
    else if(tok&&byId[tok.id]&&!used.has(tok.id)){out.push(byId[tok.id]);used.add(tok.id);}
  });
  base.forEach(b=>{if(!used.has(b.id)){out.push(b);used.add(b.id);}});

function layoutBlocks(exceptId){

function updateSeqStats(){const total=seqTotal();const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};set('seqCount',seqSongs.length);set('seqLen',fmtT(total));set('seqTot',fmtT(total));set('seqSides',seqSides());}

function seqSides(){const total=seqTotal();let acc=0,split=0,best=1e9;for(let i=0;i<seqSongs.length;i++){acc+=seqSongs[i].dur;const d=Math.abs(acc-total/2);if(d<best){best=d;split=i+1;}}return`${split} / ${seqSongs.length-split}`;}

function mseqRow(s,i){

function renderSeqMobileList(){const host=document.getElementById('mseqList');if(!host)return;host.innerHTML=seqSongs.map((s,i)=>mseqRow(s,i)).join('');updateSeqStats();const tot=document.getElementById('seqTot');if(tot)tot.textContent=fmtT(seqTotal());}
function seqPlayTrack(id){const idx=seqSongs.findIndex(s=>s.id===id);if(idx<0)return;const s=seqSongs[idx];
  if(!s.url){const n=seqPlayableFrom(idx);if(n<0){uiAlert('No playable audio yet — set a master (or upload a file) on a song first.');return;}}
  seqPos=accBefore(idx);
  if(seqPlaying){if(s.url){seqStartSong(idx,0);}else{const n=seqPlayableFrom(idx);seqPos=accBefore(n);seqStartSong(n,0);}}
  else{seqPlay();}
  seqUpdCurrent(seqCurGlobal());}
function seqMoveTrack(id,dir){const i=seqSongs.findIndex(s=>s.id===id);const j=i+dir;if(i<0||j<0||j>=seqSongs.length)return;[seqSongs[i],seqSongs[j]]=[seqSongs[j],seqSongs[i]];if(!seqPlaying)seqPos=0;renderSeqMobileList();seqPersist();}
/* ===== real-audio sequencer engine ===== */
let seqPlaying=false,seqPos=0,seqIdx=0,seqAudio=null,seqRaf=null;
function seqAt(off){let acc=0;for(let i=0;i<seqSongs.length;i++){if(off<acc+seqSongs[i].dur)return{idx:i,into:off-acc};acc+=seqSongs[i].dur;}const last=Math.max(0,seqSongs.length-1);return{idx:last,into:seqSongs.length?seqSongs[last].dur:0};}
function accBefore(idx){let a=0;for(let i=0;i<idx&&i<seqSongs.length;i++)a+=seqSongs[i].dur;return a;}
function seqPlayableFrom(idx){for(let i=Math.max(0,idx);i<seqSongs.length;i++)if(seqSongs[i].url)return i;return -1;}
function seqCurGlobal(){if(!seqPlaying)return seqPos;return accBefore(seqIdx)+(seqAudio?seqAudio.currentTime:0);}
function toggleSeq(){seqPlaying?seqPause():seqPlay();}
function seqPlay(){
  if(seqPlaying||!seqSongs.length)return;
  let{idx,into}=seqAt(seqPos);
  if(!seqSongs[idx]||!seqSongs[idx].url){const n=seqPlayableFrom(idx+1);if(n<0){uiAlert('No playable audio yet — set a master (or upload a file) on at least one song to hear the album here.');return;}idx=n;into=0;seqPos=accBefore(idx);}
  seqPlaying=true;document.body.classList.add('seqplaying');
  const _ph=document.getElementById('seqPlayhead');if(_ph)_ph.style.display='block';
  seqStartSong(idx,into);
  seqRaf=requestAnimationFrame(seqTick);
}
function seqStartSong(idx,into){
  seqIdx=idx;const s=seqSongs[idx];if(!s||!s.url)return;
  if(!seqAudio){seqAudio=new Audio();seqAudio.addEventListener('ended',seqSongEnded);}
  if(seqAudio.src!==s.url){seqAudio.src=s.url;}
  const go=()=>{try{seqAudio.currentTime=into||0;}catch(e){}if(seqPlaying)seqAudio.play().catch(()=>{});};
  if(seqAudio.readyState>=1)go();else seqAudio.addEventListener('loadedmetadata',go,{once:true});
}
function seqSongEnded(){const n=seqPlayableFrom(seqIdx+1);if(n<0){seqPos=0;seqStop();return;}seqPos=accBefore(n);seqStartSong(n,0);}
function seqPause(){if(!seqPlaying)return;seqPos=seqCurGlobal();seqPlaying=false;document.body.classList.remove('seqplaying');if(seqRaf)cancelAnimationFrame(seqRaf);if(seqAudio)seqAudio.pause();}
function seqStop(){seqPlaying=false;document.body.classList.remove('seqplaying');if(seqRaf)cancelAnimationFrame(seqRaf);if(seqAudio)seqAudio.pause();const ph=document.getElementById('seqPlayhead');if(ph)ph.style.left='0px';const c=document.getElementById('seqCur');if(c)c.textContent=fmtT(seqPos);seqClearCurrent();}
function positionPlayhead(off,total){const tl=document.getElementById('seqTimeline');if(!tl)return;const w=tl.clientWidth;const ph=document.getElementById('seqPlayhead');if(ph)ph.style.left=((total?off/total:0)*w)+'px';}
function seqTick(){const total=seqTotal();const off=seqCurGlobal();positionPlayhead(off,total);const fill=document.getElementById('seqFill');if(fill)fill.style.width=(total?off/total*100:0).toFixed(2)+'%';const c=document.getElementById('seqCur');if(c)c.textContent=fmtT(off);seqUpdCurrent(off);if(seqPlaying)seqRaf=requestAnimationFrame(seqTick);}
function seqUpdCurrent(off){const{idx,into}=seqAt(off);const s=seqSongs[idx];if(!s)return;document.querySelectorAll('#seqTimeline .block').forEach((b,i)=>b.classList.toggle('current',seqPlaying&&i===idx));document.querySelectorAll('#seqOrder .ol-row').forEach((r,i)=>r.classList.toggle('current',seqPlaying&&i===idx));document.querySelectorAll('#mseqList .mseq-row').forEach((r,i)=>r.classList.toggle('current',seqPlaying&&i===idx));if(seqPlaying){document.getElementById('seqNow').innerHTML=`<span class="swatch" style="background:${s.color}"></span>${String(idx+1).padStart(2,'0')} · ${esc(s.name)}`;document.getElementById('seqSub').textContent=`${fmtT(into)} / ${fmtT(s.dur)} — playing ${s.url?'master/most-recent':'(no audio)'}`;}}
function seqClearCurrent(){document.querySelectorAll('#seqTimeline .block').forEach(b=>b.classList.remove('current'));document.querySelectorAll('#seqOrder .ol-row').forEach(r=>r.classList.remove('current'));}
function seqSeekClient(x){
  const total=seqTotal();const tl=document.getElementById('seqTimeline');if(!tl)return;const r=tl.getBoundingClientRect();
  const pct=Math.max(0,Math.min(1,(x-r.left)/r.width));seqPos=pct*total;
  let{idx,into}=seqAt(seqPos);const s=seqSongs[idx];
  if(seqPlaying){
    if(!s||!s.url){const n=seqPlayableFrom(idx);if(n<0){seqStop();}else{seqStartSong(n,0);seqPos=accBefore(n);}}
    else seqStartSong(idx,into);
  }
  document.getElementById('seqPlayhead').style.display='block';
  positionPlayhead(seqPos,total);
  document.getElementById('seqCur').textContent=fmtT(seqPos);
  const now=document.getElementById('seqNow');if(now&&s)now.innerHTML=`<span class="swatch" style="background:${s.color}"></span>${String(idx+1).padStart(2,'0')} · ${esc(s.name)}`;
  const sub=document.getElementById('seqSub');if(sub&&s)sub.textContent=seqPlaying?`playing ${esc(s.name)}`:`Scrubbed to ${esc(s.name)} · press play`;
}
function shuffleSeq(){seqStop();for(let i=seqSongs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[seqSongs[i],seqSongs[j]]=[seqSongs[j],seqSongs[i]];}seqPos=0;renderSeq();seqPersist();}
function persistSeqOrder(){const al=AL();if(!al)return;const order=seqSongs.filter(s=>!s.placeholder).map(s=>s.id);al.songs.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));fetch('/api/song-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({albumId:al.id,order})}).catch(()=>{});}
/* ---- pointer drag: timeline blocks ---- */
function blockEl(id){return document.querySelector(`#seqTimeline .block[data-id="${id}"]`);}
let blockDrag=null;
function blockPointerDown(e,id){if(e.button)return;const el=blockEl(id);if(!el)return;const r=el.getBoundingClientRect();blockDrag={id,startX:e.clientX,grabDx:e.clientX-r.left,moved:false};}
// The held block follows the cursor 1:1 (no transition); the others slide to
// their new slots via the CSS `left` transition — fluid, not snap-on-release.
function seqDraggedFollow(clientX){const el=blockEl(blockDrag.id);if(!el)return;const tr=document.getElementById('seqTimeline').getBoundingClientRect();const w=el.offsetWidth;let leftPx=clientX-tr.left-blockDrag.grabDx;leftPx=Math.max(0,Math.min(tr.width-w,leftPx));el.style.left=leftPx+'px';}
function seqReorderByCursor(){
  const el=blockEl(blockDrag.id);if(!el)return;const dr=el.getBoundingClientRect();const dc=dr.left+dr.width/2;
  // Compare the held block's center against each OTHER slot's target center
  // (computed from the running order, so transitions don't cause jitter).
  const tr=document.getElementById('seqTimeline').getBoundingClientRect();const total=seqTotal();let acc=0;const centers=[];
  seqSongs.forEach(s=>{centers.push({id:s.id,c:tr.left+((acc+s.dur/2)/total)*tr.width});acc+=s.dur;});
  const others=centers.filter(x=>x.id!==blockDrag.id);
  let insert=others.length;for(let i=0;i<others.length;i++){if(dc<others[i].c){insert=i;break;}}
  const dragged=seqSongs.find(s=>s.id===blockDrag.id);const rest=seqSongs.filter(s=>s.id!==blockDrag.id);
  const next=rest.slice();next.splice(insert,0,dragged);
  if(next.length===seqSongs.length&&next.every((s,i)=>s.id===seqSongs[i].id))return;
  seqSongs=next;layoutBlocks(blockDrag.id);updateSeqStats();renderSeqOrder();
}
document.addEventListener('pointermove',e=>{
  if(!blockDrag)return;
  if(!blockDrag.moved){if(Math.abs(e.clientX-blockDrag.startX)<5)return;blockDrag.moved=true;document.body.style.cursor='grabbing';const el=blockEl(blockDrag.id);if(el){el.classList.add('seq-lift');el.style.transform='translateY(-7px) scale(1.03)';}}
  seqDraggedFollow(e.clientX);
  seqReorderByCursor();
});
document.addEventListener('pointerup',e=>{
  if(!blockDrag)return;const bd=blockDrag;blockDrag=null;document.body.style.cursor='';
  const el=blockEl(bd.id);
  if(!bd.moved){if(el){el.classList.remove('seq-lift');el.style.transform='';}seqSeekClient(e.clientX);return;}
  if(el){el.classList.remove('seq-lift');el.style.transform='';}
  layoutBlocks();updateSeqStats();renderSeqOrder();seqStop();seqPos=0;seqPersist();
});
/* ---- pointer drag: order-list rows ---- */
let rowDrag=null;
function rowEl(id){return document.querySelector(`#seqOrder .ol-row[data-id="${id}"]`);}
function rowPointerDown(e,id){if(e.button)return;const idx=seqSongs.findIndex(s=>s.id===id);if(idx<0)return;e.preventDefault();rowDrag={id,idx,startY:e.clientY,moved:false,overIdx:idx,before:true};}
function rowAtClientY(y){const rows=[...document.querySelectorAll('#seqOrder .ol-row')];for(let i=0;i<rows.length;i++){const r=rows[i].getBoundingClientRect();if(y<r.top+r.height/2)return{overIdx:i,before:true};if(y<=r.bottom)return{overIdx:i,before:false};}return{overIdx:seqSongs.length-1,before:false};}
document.addEventListener('pointermove',e=>{
  if(!rowDrag)return;const dy=e.clientY-rowDrag.startY;
  if(!rowDrag.moved){if(Math.abs(dy)<4)return;rowDrag.moved=true;document.body.style.cursor='grabbing';const el=rowEl(rowDrag.id);if(el)el.classList.add('ol-lift');}
  const el=rowEl(rowDrag.id);if(el)el.style.transform=`translateY(${dy}px)`;
  const{overIdx,before}=rowAtClientY(e.clientY);rowDrag.overIdx=overIdx;rowDrag.before=before;
  document.querySelectorAll('#seqOrder .ol-row').forEach(x=>x.classList.remove('ol-over-top','ol-over-bot'));
  if(overIdx!==rowDrag.idx){const overEl=rowEl(seqSongs[overIdx].id);if(overEl)overEl.classList.add(before?'ol-over-top':'ol-over-bot');}
});
document.addEventListener('pointerup',()=>{
  if(!rowDrag)return;const rd=rowDrag;rowDrag=null;document.body.style.cursor='';
  const el=rowEl(rd.id);if(el){el.classList.remove('ol-lift');el.style.transform='';}
  document.querySelectorAll('#seqOrder .ol-row').forEach(x=>x.classList.remove('ol-over-top','ol-over-bot'));
  if(!rd.moved)return;
  const moved=seqSongs[rd.idx];let target=rd.overIdx+(rd.before?0:1);seqSongs.splice(rd.idx,1);if(rd.idx<target)target--;target=Math.max(0,Math.min(seqSongs.length,target));seqSongs.splice(target,0,moved);
  seqStop();seqPos=0;renderSeq();seqPersist();
});

/* ===== SCHEDULE ===== */
const SCHED_MO=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const SCHED_MOI={JAN:'01',FEB:'02',MAR:'03',APR:'04',MAY:'05',JUN:'06',JUL:'07',AUG:'08',SEP:'09',OCT:'10',NOV:'11',DEC:'12'};
let schedKind='deadline';
function renderSchedule(){
  const al=AL();
  content.innerHTML=`<div class="ws-head"><div class="eyebrow">${al.title}</div><div class="view-title">Release schedule</div><div class="ws-sub">Add every milestone, deadline and goal for this record. Mark each as a <b>goal date</b> or a <b>hard deadline</b> — they’re color-coded on the timeline.</div></div>
  <div class="gen-box" style="align-items:flex-end;gap:12px">
    <div class="mf" style="flex:2;min-width:150px"><label>Item</label><input id="schT" placeholder="e.g. Masters to mastering engineer"></div>
    <div class="mf" style="flex:3;min-width:180px"><label>Description</label><input id="schD" placeholder="Details (optional)"></div>
    <div class="mf" style="flex:none"><label>Date</label><input type="date" id="schDate"></div>
    <div class="mf" style="flex:none"><label>Type</label><div class="sched-type"><span class="lchip ${schedKind==='goal'?'on':''}" id="schKind-goal" onclick="setSchedKind('goal')">Goal date</span><span class="lchip ${schedKind==='deadline'?'on':''}" id="schKind-deadline" onclick="setSchedKind('deadline')">Hard deadline</span></div></div>
    <button class="solid-btn" onclick="addScheduleItem()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Add</button>
  </div>
  <div class="timeline-v" id="schedTimeline"></div>`;
  drawSchedule(al.schedule||[]);
}
function setSchedKind(k){schedKind=k;['goal','deadline'].forEach(x=>{const el=document.getElementById('schKind-'+x);if(el)el.classList.toggle('on',x===k);});}
function schedDate(s){if(s.date)return s.date;if(s.yr&&s.mo&&s.dy)return `${s.yr}-${SCHED_MOI[s.mo]||'01'}-${String(s.dy).padStart(2,'0')}`;return '';}
function sortSchedule(arr){arr.sort((a,b)=>(schedDate(a)||'').localeCompare(schedDate(b)||''));}
function drawSchedule(sched){
  const host=document.getElementById('schedTimeline');if(!host)return;
  if(!sched.length){host.innerHTML='<div class="empty-note" style="padding:28px;text-align:left">No schedule items yet — add your first milestone above.</div>';return;}
  const kindMap={goal:{col:'var(--blue)',label:'Goal',cls:'kind-goal'},deadline:{col:'#e0322a',label:'Deadline',cls:'kind-deadline'}};
  host.innerHTML=sched.map((s,i)=>{
    const k=s.kind&&kindMap[s.kind];
    const col=k?k.col:(s.tag==='done'?'var(--green)':s.tag==='due'?'var(--amber)':'var(--accent)');
    const label=k?k.label:(s.tag==='done'?'Done':s.tag==='due'?'Due soon':'Upcoming');
    const cls=k?k.cls:(s.tag||'up');

let imgTarget=null;const fileInput=document.getElementById('fileInput');fileInput.accept='image/*';

fileInput.addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;

  e.target.value='';

  if(type==='songart'){await uploadSongArt(f,idx);return;}

      if(!up.ok)throw new Error('url');

      if(!put.ok)throw new Error('put');
      await fetch('/api/artist-photo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:idx,key:up.key})});
    }catch(err){/* local preview stays this session */}

  }

  render();

    const up=await fetch('/api/asset-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({albumId:al.id,kind:type,slot:idx,name:f.name})}).then(r=>r.json());
    if(!up.ok)throw new Error('url');

    if(!put.ok)throw new Error('put');
    await fetch('/api/album-asset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({albumId:al.id,kind:type,slot:idx,key:up.key})});
  }catch(err){/* local preview stays this session; will not persist if upload failed */}
});
async function uploadSongArt(f,songId){

  // mirror into album artwork list (labeled with the song name)
  let entry=al.artwork.find(x=>x.song&&x.songId===songId);
  if(entry)entry.img=localUrl;else al.artwork.push({label:s.t,img:localUrl,song:true,songId});
  const tile=document.querySelector(`.idea-song[data-song="${songId}"] .song-art`);
  if(tile){tile.classList.add('filled');tile.innerHTML=`<img src="${localUrl}"><div class="sa-replace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div>`;}
  try{
    const up=await fetch('/api/song-art',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'upload-url',songId,name:f.name})}).then(r=>r.json());
    if(!up.ok)throw new Error('url');
    const put=await fetch(up.uploadUrl,{method:'PUT',headers:{'Content-Type':up.contentType},body:f});if(!put.ok)throw new Error('put');
    await fetch('/api/song-art',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'set',songId,key:up.key})});
  }catch(e){/* local preview stays this session */}
}
function saveSongMeta(songId,field,value){
  const al=AL();const s=al&&al.songs.find(x=>x.id===songId);if(s)s[field]=value;
  const b={songId};b[field]=value;
  fetch('/api/song-meta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).catch(()=>{});
}

/* ===== audio cleanup on nav ===== */
function stopAllAudio(){if(curAudio){curAudio.pause();curAudio=null;curTid=null;}if(seqPlaying){seqStop();}seqPos=0;}

document.getElementById('scroll').addEventListener('scroll',function(){document.getElementById('topbar').classList.toggle('scrolled',this.scrollTop>10);});
window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());
document.addEventListener('click',e=>{const w=document.getElementById('quickNav');if(w&&!w.contains(e.target))closeNotif();});
window.addEventListener('resize',()=>{if(route.view==='dashboard'){fitBandName();fitHeroCover();fitDashActivity();}});
// Desktop dashboard: show only the activity rows that fit (no internal scroll);
// the "View all" button covers the rest. Mobile shows a fixed 5 (no trimming).
function fitDashActivity(){
  if(isMobile())return;
  const list=document.getElementById('dashActList');if(!list)return;
  const rows=[...list.querySelectorAll('.act-row')];if(!rows.length)return;
  rows.forEach(r=>r.style.display='');
  const max=list.clientHeight;let used=0;
  for(const r of rows){const h=r.offsetHeight;if(used+h>max-2){r.style.display='none';}else used+=h;}
}

/* ===== REAL DATA (Supabase via /api) ===== */
function defaultRoute(){
  if(!artists.length)return{view:'roster'};
  const a0=artists[0],al0=a0.albums[0];
  return al0?{view:'dashboard',artistId:a0.id,albumId:al0.id}:{view:'albums',artistId:a0.id};
}
// Persist the current route so a page refresh returns to the same view/section.
function saveRoute(){try{localStorage.setItem('albumap:route',JSON.stringify(route));}catch(e){}}
function restoreRoute(){
  try{const s=localStorage.getItem('albumap:route');if(!s)return null;const r=JSON.parse(s);if(!r||!r.view)return null;
    if(r.artistId){const a=getArtist(r.artistId);if(!a)return null;if(r.albumId&&!getAlbum(a,r.albumId))return null;}
    return r;
  }catch(e){return null;}
}
async function reloadData(nextRoute){
  try{const res=await fetch('/api/studio-data',{cache:'no-store'});if(res.ok){const d=await res.json();artists=Array.isArray(d.artists)?d.artists:[];me=d.me||null;archivedAlbums=Array.isArray(d.archived)?d.archived:[];}}catch(e){}
  route=nextRoute||restoreRoute()||defaultRoute();hist=[{...route}];hi=0;render();
}
function persistCell(songId,instrument,state){
  fetch('/api/cell',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({songId,instrument,state})}).catch(()=>{});
}
// Persist a cell's full assignee list. Status untouched. `changedName`/`added`
// let the server log a precise line; `silent` (bulk) suppresses that log so the
// feed gets one client-side summary instead of one row per cell.
function persistAssignees(songId,instrument,assignees,silent,changedName,added){
  fetch('/api/cell',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({songId,instrument,assignees:assignees||[],silent:!!silent,changedName:changedName||'',added:!!added})}).catch(()=>{});
}
async function createAlbumFlow(artistName){
  let artist,title;
  if(artistName!=null){ // adding an album under an existing artist
    title=(await uiPrompt('Album title','',{title:'New album',okLabel:'Create'})||'').trim();if(!title)return;artist=artistName;
  }else{ // "New artist" from the roster — ask the artist first
    artist=(await uiPrompt('Artist / band name','',{title:'New artist',okLabel:'Next'})||'').trim();if(!artist)return;
    title=(await uiPrompt('First album title','',{title:'New album',okLabel:'Create'})||'').trim();if(!title)return;
  }
  const res=await fetch('/api/album',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,artist})});
  if(!res.ok){uiAlert('Could not create the album.');return;}
  const {id}=await res.json();
  await reloadData();
  for(const a of artists){const al=a.albums.find(x=>x.id===id);if(al){nav({view:'dashboard',artistId:a.id,albumId:al.id});break;}}
}
/* ===== archive / restore / delete (items kept out of the working view) ===== */
async function archiveAlbum(artistId,albumId){
  const a=getArtist(artistId);const al=a&&getAlbum(a,albumId);if(!al)return;
  if(!await uiConfirm('It moves to Settings → Archived — restore it anytime.',{title:`Archive “${al.title}”?`,okLabel:'Archive'}))return;
  await fetch('/api/album',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:albumId,archived:true})});
  await reloadData({view:'albums',artistId});
}
async function archiveArtist(artistId){
  const a=getArtist(artistId);if(!a)return;const n=(a.albums||[]).length;
  if(!await uiConfirm(`This archives ${a.name} and its ${n} album${n!==1?'s':''}. Restore anytime from Settings.`,{title:`Archive ${a.name}?`,okLabel:'Archive'}))return;
  await fetch('/api/album',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({archiveArtist:a.name,archived:true})});
  await reloadData({view:'roster'});
}
async function restoreAlbum(albumId){
  await fetch('/api/album',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:albumId,archived:false})}).catch(()=>{});
  await reloadData({view:'settings'});
}
async function restoreArtist(name){
  await fetch('/api/album',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({archiveArtist:name,archived:false})}).catch(()=>{});
  await reloadData({view:'settings'});
}
async function deleteAlbumForever(albumId,title){
  if(!await uiConfirm(`This permanently deletes “${title}” and everything in it — songs, files, grid, artwork, merch, comments. It cannot be undone.`,{title:'Delete forever?',okLabel:'Delete forever',danger:true}))return;
  if(!await uiConfirm(`Last chance — “${title}” and all of its data will be gone for good.`,{title:'Are you absolutely sure?',okLabel:'Yes, delete everything',danger:true}))return;
  await fetch('/api/album?id='+encodeURIComponent(albumId),{method:'DELETE'}).catch(()=>{});
  await reloadData({view:'settings'});
}
async function renameBand(artistId){
  const a=getArtist(artistId);if(!a)return;
  const nn=(await uiPrompt('Band / artist name',a.name,{title:'Rename artist'})||'').trim();if(!nn||nn===a.name)return;
  const res=await fetch('/api/album',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({renameArtistFrom:a.name,renameArtistTo:nn})});
  if(!res.ok){uiAlert('Could not rename the band.');return;}
  await reloadData({view:'roster'});
  const na=artists.find(x=>x.name===nn);if(na)nav({view:'albums',artistId:na.id});
}
async function renameAlbum(artistId,albumId){
  const a=getArtist(artistId);const al=a&&getAlbum(a,albumId);if(!al)return;
  const nt=(await uiPrompt('Album title',al.title,{title:'Rename album'})||'').trim();if(!nt||nt===al.title)return;
  const res=await fetch('/api/album',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:albumId,title:nt})});
  if(!res.ok){uiAlert('Could not rename the album.');return;}
  await reloadData({...route});
}
async function renameSong(id){
  const al=AL();const s=al&&al.songs.find(x=>x.id===id);if(!s)return;
  const nt=(await uiPrompt('Song title',s.t||'',{title:'Rename song'})||'').trim();if(!nt||nt===s.t)return;
  s.t=nt;renderSongList();
  fetch('/api/song-meta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({songId:id,title:nt})}).catch(()=>{});
}
async function addSongFlow(){
  const al=AL();if(!al)return;
  const title=await uiPrompt('Song title','',{title:'Add song',okLabel:'Add'});if(!title||!title.trim())return;
  const res=await fetch('/api/song',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({albumId:al.id,title:title.trim()})});
  if(!res.ok){uiAlert('Could not add the song.');return;}
  await reloadData({...route}); // reload syncs both the grid and songs views
}
async function deleteSong(id){
  const al=AL();const s=al&&al.songs.find(x=>x.id===id);if(!s)return;
  if(!await uiConfirm(`This removes its grid cells, files and comments.`,{title:`Delete “${s.t}”?`,okLabel:'Delete',danger:true}))return;
  al.songs=al.songs.filter(x=>x.id!==id);
  if(route.songId===id)route.songId=null;
  render();
  fetch('/api/song?id='+encodeURIComponent(id),{method:'DELETE'}).catch(()=>{});
}
async function inviteMember(){
  const al=AL();if(!al)return;const name=await uiPrompt('Invite who?','',{title:'Invite member',placeholder:'Bandmate name',okLabel:'Invite'});if(!name||!name.trim())return;
  const res=await fetch('/api/member',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({albumId:al.id,name:name.trim()})});
  if(!res.ok){uiAlert('Could not add member.');return;}
  await reloadData({...route});
}
// Timestamp for a comment on the CURRENT track — uses the playhead position even
// when paused (so you can pause to type and still stamp where you stopped).
function curStamp(){return (curAudio&&curAudio.currentTime>0.05)?fmtT(curAudio.currentTime):'';}
function stampFor(trackId){return (curTid===trackId&&curAudio&&curAudio.currentTime>0.05)?fmtT(curAudio.currentTime):'';}
function postComment(songId){
  const inp=document.getElementById('cmt-'+songId);if(!inp)return;const text=inp.value.trim();if(!text)return;
  inp.value='';
  const al=AL();const s=al&&al.songs.find(x=>x.id===songId);
  // Attach to the file currently playing in this song (with its timestamp), else
  // the song's master/first file so the marker lands somewhere sensible.
  let fileSid=null,stamp='';
  if(curTid){const t=findFile(curTid);if(t&&s&&s.files.indexOf(t)>=0){fileSid=t.sid||null;stamp=curStamp();}}
  if(!fileSid&&s&&s.files.length){fileSid=(s.files.find(f=>f.master)||s.files[0]).sid||null;}
  if(s){const c={who:'You',color:'#FF4D1C',stamp,text,fileSid,at:new Date().toISOString()};s.comments.push(c);route.songId=songId;renderSongList();
    fetch('/api/comment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({songId,text,stamp,fileId:fileSid})}).then(r=>r.json()).then(d=>{if(d&&d.id)c.id=d.id;}).catch(()=>{});}
}
/* ===== references (artist / song / genre / link / file) ===== */
const REF_TYPES={
  artist:{label:'Artist',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>'},
  song:{label:'Song',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>'},
  genre:{label:'Genre',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 13.4 12 22l-9-9V3h10z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>'},
  link:{label:'Link',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>'},
  file:{label:'File',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'},
  note:{label:'Note',icon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'}
};
function refType(r){return (r&&r.type&&REF_TYPES[r.type])?r.type:'note';}
function refSub(r){const t=refType(r);
  if(t==='song')return r.by?('Song · '+esc(r.by)):'Song';
  if(t==='artist')return 'Artist';
  if(t==='genre')return 'Genre';
  if(t==='link')return esc(r.url||'');
  if(t==='file')return 'File'+(r.url?'':' · uploading…');
  return esc(r.u||'');}
// References work on a "host" — a song (hid = song id) or a bank file
// (hid = "FILE:"+client id). Same UI + flow for both.
function refHostById(hid){
  const al=AL();if(!al)return null;
  if(typeof hid==='string'&&hid.indexOf('FILE:')===0){const t=findFile(+hid.slice(5));if(!t)return null;t.refs=t.refs||[];return {kind:'file',t,refs:t.refs,persist:()=>persistFileRefs(t),rerender:()=>renderBank()};}
  const s=al.songs.find(x=>x.id===hid);if(!s)return null;s.refs=s.refs||[];return {kind:'song',s,refs:s.refs,persist:()=>persistRefs(s),rerender:()=>{route.songId=s.id;renderSongList();}};
}
function refRow(hid,r,idx){const t=refType(r);const title=esc(r.title||r.t||'(untitled)');
  const open=(t==='link'&&r.url)?`<a class="ico-btn" href="${esc(r.url)}" target="_blank" rel="noopener" title="Open" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M8 7h9v9"/></svg></a>`
    :(t==='file'&&r.url)?`<a class="ico-btn" href="${esc(r.url)}" target="_blank" rel="noopener" title="Open file" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M5 21h14"/></svg></a>`:'';
  return `<div class="ref-row"><div class="ri ri-${t}">${REF_TYPES[t].icon}</div><div style="flex:1;min-width:0"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</div><div class="ref-sub">${refSub(r)}</div></div>${open}<button class="ico-btn" title="Remove" onclick="removeRef('${hid}',${idx})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>`;
}
function refsBodyFor(hid,refs){
  const rows=(refs&&refs.length)?refs.map((r,idx)=>refRow(hid,r,idx)).join(''):'<div class="empty-note">Artists, songs, genres, links or files you want this to feel like.</div>';
  const menu=['artist','song','genre','link','file'].map(t=>`<button onclick="addRefType('${hid}','${t}')">${REF_TYPES[t].icon}${REF_TYPES[t].label}</button>`).join('');
  return `${rows}<button class="ghost-btn" style="margin-top:10px;width:100%;justify-content:center" onclick="toggleRefMenu('${hid}')">＋ Add reference</button><div class="ref-menu" id="refmenu-${hid}" style="display:none">${menu}</div>`;
}
function refsBody(s){return refsBodyFor(s.id,s.refs);}
function toggleRefMenu(hid,forceClose){const m=document.getElementById('refmenu-'+hid);if(!m)return;m.style.display=(forceClose||m.style.display!=='none')?'none':'';}
function persistRefs(s){const clean=(s.refs||[]).map(r=>r.type==='file'?{type:'file',title:r.title,key:r.key||null}:r);fetch('/api/song-meta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({songId:s.id,refs:clean})}).catch(()=>{});}
function persistFileRefs(t){if(!t.sid)return;const clean=(t.refs||[]).map(r=>r.type==='file'?{type:'file',title:r.title,key:r.key||null}:r);fetch('/api/song-file',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:t.sid,refs:clean})}).catch(()=>{});}
async function addRefType(hid,type){
  toggleRefMenu(hid,true);
  const host=refHostById(hid);if(!host)return;
  let ref=null;
  if(type==='artist'){const n=(await uiPrompt('Artist name','',{title:'Reference — artist'})||'').trim();if(!n)return;ref={type,title:n};}
  else if(type==='song'){const n=(await uiPrompt('Song title','',{title:'Reference — song'})||'').trim();if(!n)return;const by=(await uiPrompt('Artist (optional)','',{title:'Reference — song'})||'').trim();ref={type,title:n,by};}
  else if(type==='genre'){const n=(await uiPrompt('Genre','',{title:'Reference — genre'})||'').trim();if(!n)return;ref={type,title:n};}
  else if(type==='link'){let u=(await uiPrompt('Link URL','',{title:'Reference — link',placeholder:'https://…'})||'').trim();if(!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;const l=(await uiPrompt('Label (optional)','',{title:'Reference — link'})||'').trim();ref={type,title:l||u,url:u};}
  else if(type==='file'){refFileTarget=hid;document.getElementById('refFileInput').click();return;}
  host.refs.push(ref);host.rerender();host.persist();
}
function removeRef(hid,idx){const host=refHostById(hid);if(!host)return;host.refs.splice(idx,1);host.rerender();host.persist();}
let refFileTarget=null;
async function uploadRefFile(f){
  const host=refHostById(refFileTarget);if(!host)return;
  const ref={type:'file',title:f.name,key:null,url:URL.createObjectURL(f)};
  host.refs.push(ref);host.rerender();
  try{
    const payload=host.kind==='file'?{fileId:host.t.sid,name:f.name}:{songId:host.s.id,name:f.name};
    const up=await fetch('/api/ref-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(r=>r.json());
    if(!up.ok)throw new Error('url');
    const put=await fetch(up.uploadUrl,{method:'PUT',headers:{'Content-Type':up.contentType},body:f});if(!put.ok)throw new Error('put');
    ref.key=up.key;host.persist();
  }catch(e){/* local preview stays this session */}
}
function saveFileNotes(fileClientId,value){const t=findFile(fileClientId);if(!t)return;t.notes=value;if(t.sid)fetch('/api/song-file',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:t.sid,notes:value})}).catch(()=>{});}
async function addCredit(songId){
  const who=await uiPrompt('Credit — who?','',{title:'Add credit'});if(!who||!who.trim())return;const role=(await uiPrompt('Role (guitar, vox, writing…)','',{title:'Add credit'})||'').trim();const split=(await uiPrompt('Split % (optional, e.g. 40%)','',{title:'Add credit'})||'').trim();
  const al=AL();const s=al&&al.songs.find(x=>x.id===songId);if(!s)return;
  s.credits.push({who:who.trim(),role,split});route.songId=songId;renderSongList();
  fetch('/api/song-meta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({songId,credits:s.credits})}).catch(()=>{});
}
reloadData();
