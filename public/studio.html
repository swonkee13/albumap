<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>albumap.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --base:#0a0a0b;--panel:#141417;--panel-2:#17171b;--card:#1c1c21;--card-hi:#222228;
    --hover:#26262c;--line:#2a2a30;--line-soft:#212127;
    --txt:#f4f4f5;--txt-2:#a1a1aa;--txt-3:#6b6b73;
    --accent:#FF4D1C;--accent-hi:#FF6338;--accent-dim:rgba(255,77,28,.15);
    --amber:#F5A623;--green:#3ECF8E;--blue:#4EA8E8;--grey:#3a3a42;
    --r-lg:18px;--r-md:14px;--r-sm:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--base);color:var(--txt);font-family:'Inter',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
  .mono{font-family:'JetBrains Mono',monospace}
  .app{display:grid;grid-template-columns:262px 1fr;height:100vh;padding:8px;gap:8px}

  /* sidebar */
  .sidebar{background:var(--panel);border-radius:var(--r-lg);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line-soft)}
  .brand{display:flex;align-items:center;gap:10px;padding:20px 20px 16px;cursor:pointer}
  .brand .brand-logo{height:30px;width:auto;max-width:200px;display:block}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:transparent;display:grid;place-items:center;flex:none}
  .brand .logo svg{width:32px;height:32px}
  .brand .name{font-weight:800;font-size:16px;letter-spacing:-.02em;font-family:'Poppins'}
  .brand .name span{color:var(--txt-3);font-weight:600}
  .nav{padding:4px 12px}
  .nav-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r-sm);color:var(--txt-2);font-weight:500;cursor:pointer;transition:.15s}
  .nav-item svg{width:18px;height:18px;flex:none}
  .nav-item:hover{background:var(--hover);color:var(--txt)}
  .nav-item.active{background:var(--accent-dim);color:var(--accent-hi)}
  .lib{margin:12px;margin-top:8px;background:var(--panel-2);border-radius:var(--r-md);flex:1;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line-soft)}
  .lib-head{display:flex;align-items:center;gap:9px;padding:14px 16px 10px;color:var(--txt-2);font-weight:600;font-size:13px}
  .lib-head svg{width:17px;height:17px}
  .lib-list{overflow-y:auto;padding:4px 8px 8px}
  .lib-row{display:flex;align-items:center;gap:11px;padding:7px 8px;border-radius:var(--r-sm);cursor:pointer;transition:.12s}
  .lib-row:hover{background:var(--hover)}
  .lib-row.active{background:var(--accent-dim)}
  .lib-row .thumb{width:40px;height:40px;border-radius:50%;flex:none;background:var(--card-hi);object-fit:cover;display:grid;place-items:center;color:var(--txt-3);overflow:hidden;font-family:'Poppins';font-weight:700;font-size:13px}
  .lib-row .thumb img{width:100%;height:100%;object-fit:cover}
  .lib-row .meta{min-width:0}
  .lib-row .meta .l1{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lib-row .meta .l2{color:var(--txt-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  /* sidebar nav tree (artist → albums → sections) */
  .lib-sub{margin:2px 0 6px 10px;border-left:1px solid var(--line-soft);padding-left:6px}
  .lib-alb{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;color:var(--txt-2);font-size:12.5px;font-weight:600}
  .lib-alb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lib-alb:hover{background:var(--hover);color:var(--txt)}
  .lib-alb.active{color:var(--accent-hi)}
  .lib-alb svg{width:13px;height:13px;flex:none;opacity:.75}
  .lib-sub2{margin:1px 0 5px 15px;display:flex;flex-direction:column;gap:1px}
  .lib-sec{padding:5px 9px;border-radius:7px;cursor:pointer;color:var(--txt-3);font-size:12px;font-weight:500}
  .lib-sec:hover{background:var(--hover);color:var(--txt)}
  .lib-sec.active{background:var(--accent-dim);color:var(--accent-hi)}

  /* main */
  .main{background:linear-gradient(180deg,#161619 0%,var(--panel) 22%);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line-soft);position:relative}
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;position:sticky;top:0;z-index:5;background:rgba(20,20,23,.6);backdrop-filter:blur(18px);border-bottom:1px solid transparent;transition:.2s}
  .topbar.scrolled{border-bottom-color:var(--line-soft);background:rgba(15,15,17,.85)}
  .navbtns{display:flex;gap:8px}
  .circ{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.4);border:none;color:var(--txt-2);display:grid;place-items:center;cursor:pointer;transition:.15s}
  .circ:hover:not(:disabled){background:rgba(0,0,0,.7);color:var(--txt)}
  .circ:disabled{opacity:.35;cursor:default}
  .circ svg{width:17px;height:17px}
  .crumbs{display:flex;align-items:center;gap:8px;color:var(--txt-3);font-size:13px;font-weight:500;flex-wrap:wrap}
  .crumbs .c{cursor:pointer;transition:.12s}
  .crumbs .c:hover{color:var(--txt)}
  .crumbs .c.here{color:var(--txt);cursor:default}
  .crumbs .sep{opacity:.5}
  .scroll{overflow-y:auto;flex:1}
  .content{padding:12px 30px 110px}

  /* generic */
  .eyebrow{color:var(--txt-2);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.14em;display:flex;align-items:center;gap:8px}
  .eyebrow .verified{color:var(--accent-hi)}
  .eyebrow .verified svg{width:15px;height:15px;vertical-align:-3px}
  .view-title{font-family:'Poppins';font-weight:700;letter-spacing:-.02em;line-height:1.05}
  h3.sec-t{font-family:'Poppins';font-weight:600;font-size:16px;letter-spacing:-.01em}

  .ghost-btn{background:transparent;border:1px solid var(--line);color:var(--txt-2);padding:9px 16px;border-radius:22px;font-weight:600;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit;display:inline-flex;align-items:center;gap:7px}
  .ghost-btn:hover{border-color:var(--txt-2);color:var(--txt)}
  .ghost-btn svg{width:15px;height:15px}
  .solid-btn{background:var(--accent);border:none;color:#fff;padding:10px 18px;border-radius:22px;font-weight:600;font-size:13px;cursor:pointer;transition:.14s;font-family:inherit;display:inline-flex;align-items:center;gap:7px}
  .solid-btn:hover{background:var(--accent-hi)}
  .solid-btn svg{width:15px;height:15px}

  /* galleries (artist/album) */
  .gallery{display:grid;gap:18px;margin-top:24px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .g-card{background:var(--card);border-radius:var(--r-md);padding:16px;cursor:pointer;transition:.18s;border:1px solid transparent;position:relative}
  .card-edit{position:absolute;top:24px;right:24px;z-index:4;width:30px;height:30px;border-radius:8px;border:none;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;display:grid;place-items:center;opacity:0;transition:.15s}
  .g-card:hover .card-edit{opacity:1}
  .card-archive{position:absolute;top:24px;right:60px;z-index:4;width:30px;height:30px;border-radius:8px;border:none;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;display:grid;place-items:center;opacity:0;transition:.15s}
  .g-card:hover .card-archive{opacity:1}
  .card-archive:hover,.card-edit:hover{background:rgba(0,0,0,.82)}
  .card-archive svg{width:16px;height:16px}
  .card-edit:hover{background:var(--accent)}
  .card-edit svg{width:15px;height:15px}
  .name-edit{background:transparent;border:none;color:var(--txt-3);cursor:pointer;padding:6px;border-radius:8px;display:inline-grid;place-items:center;vertical-align:middle}
  .name-edit:hover{background:var(--hover);color:var(--txt)}
  .name-edit svg{width:18px;height:18px}
  .g-card:hover{background:var(--card-hi);border-color:var(--line);transform:translateY(-2px)}
  .g-card .art{width:100%;aspect-ratio:1;border-radius:var(--r-sm);background:var(--card-hi);margin-bottom:14px;overflow:hidden;position:relative;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.35)}
  .g-card .art.round{border-radius:50%}
  .g-card .art img{width:100%;height:100%;object-fit:cover}
  .g-card .art .ph{font-family:'Poppins';font-weight:700;font-size:30px;color:var(--txt-3)}
  .g-card .gt{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .g-card .gs{color:var(--txt-3);font-size:13px;margin-top:4px;display:flex;align-items:center;gap:6px}
  .status-dot{width:7px;height:7px;border-radius:50%;flex:none}
  .g-card .playfab{position:absolute;bottom:10px;right:10px;width:44px;height:44px;border-radius:50%;background:var(--accent);display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:.2s}
  .g-card:hover .playfab{opacity:1;transform:translateY(0)}
  .g-card .playfab svg{width:20px;height:20px;color:#fff;margin-left:2px}

  /* dashboard hero */
  .dash-hero{display:flex;align-items:flex-end;gap:26px;padding:32px 0 24px}
  @media(max-width:640px){.dash-hero{flex-wrap:wrap;gap:16px}.dash-hero .overall{margin-left:0}}
  /* album cover (left) with band-logo badge on its corner */
  .hero-cover-wrap{position:relative;flex:none;margin-bottom:8px}
  .hero-cover{width:134px;height:134px;border-radius:16px;overflow:hidden;background:var(--card-hi);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;box-shadow:0 14px 34px rgba(0,0,0,.5);transition:.16s}
  .hero-cover:hover{border-color:var(--accent)}
  .hero-cover img{width:100%;height:100%;object-fit:cover}
  .hero-cover .hc-ph{font-family:'Poppins';font-weight:800;font-size:54px;color:var(--txt-3)}
  .profile-up.hero-logo-badge{position:absolute;bottom:-12px;left:-12px;width:70px;height:70px;border-radius:50%;border:4px solid var(--panel);box-shadow:0 8px 20px rgba(0,0,0,.45)}
  .profile-up.hero-logo-badge .profile-empty svg{width:24px;height:24px}
  .profile-up.hero-logo-badge .up-hint{font-size:0}
  .profile-up{width:140px;height:140px;border-radius:50%;flex:none;background:var(--card-hi);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;overflow:hidden;position:relative;transition:.18s}
  .profile-up:hover{border-color:var(--accent)}
  .profile-up img{width:100%;height:100%;object-fit:cover}
  .profile-up .up-hint{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--txt);opacity:0;transition:.18s;font-size:12px;font-weight:600}
  .profile-up:hover .up-hint{opacity:1}
  .profile-up .up-hint svg{width:22px;height:22px}
  .profile-empty{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--txt-3);font-size:11px;font-weight:600;text-align:center;padding:0 12px}
  .profile-empty svg{width:26px;height:26px}
  .hero-meta{padding-bottom:6px;min-width:0;flex:1}
  .band-name{font-family:'Poppins';font-weight:700;font-size:clamp(24px,3vw,44px);letter-spacing:-.02em;line-height:1.1;margin:8px 0 12px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hero-sub{display:flex;align-items:center;gap:8px;color:var(--txt-2);font-size:13.5px;flex-wrap:wrap}
  .hero-sub b{color:var(--txt);font-weight:600}
  .hero-sub .pill{background:var(--card);border:1px solid var(--line);padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
  .dot-sep{width:3px;height:3px;border-radius:50%;background:var(--txt-3)}
  .hero-actions{display:flex;align-items:center;gap:14px;padding:18px 0 6px}
  .play-lg{width:54px;height:54px;border-radius:50%;border:none;background:var(--accent);display:grid;place-items:center;cursor:pointer;transition:.15s}
  .play-lg:hover{transform:scale(1.05);background:var(--accent-hi)}
  .play-lg svg{width:23px;height:23px;color:#fff;margin-left:3px}
  .member-stack{display:flex;align-items:center;padding-left:4px}
  .avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-left:-10px;border:2.5px solid var(--panel);cursor:pointer;transition:.15s}
  .member-stack .avatar:first-child{margin-left:0}
  .avatar:hover{transform:translateY(-3px);z-index:2}
  .avatar.in{color:#fff}
  .av-img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
  .avatar.pending{background:#2a2a30;color:var(--txt-3);border:2px dashed var(--txt-3)}
  .member-caption{display:flex;align-items:center;gap:6px;color:var(--txt-2);font-size:12.5px;font-weight:500;padding:2px 0 6px}
  .mc-dot{width:8px;height:8px;border-radius:50%;flex:none}
  .mc-dot.in{background:var(--green)}
  .mc-dot.pending{background:transparent;border:1.5px dashed var(--txt-3)}
  .overall{margin-left:auto;display:flex;align-items:center;gap:20px;padding-bottom:4px}
  .ov-stat{text-align:right}
  .ov-stat .n{font-family:'Poppins';font-weight:700;font-size:22px}
  .ov-stat .l{color:var(--txt-3);font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin-top:2px}
  .ring{position:relative;width:72px;height:72px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:'Poppins';font-weight:700;font-size:16px}
  /* hero gauge panel */
  .hero-gauges{margin-left:auto;display:flex;align-items:flex-start;gap:10px;padding-bottom:4px}
  /* gauges always stay on one row and scale down to fit (never wrap) */
  .hg-grid{display:flex;gap:12px;flex-wrap:nowrap;justify-content:flex-end;max-width:430px}
  .gauge{display:flex;flex-direction:column;align-items:center;gap:3px;flex:0 1 64px;min-width:0}
  .gauge-ring{position:relative;width:100%;max-width:64px;aspect-ratio:1;margin:0 auto}
  .gauge-ring svg{width:100%;height:100%;display:block}
  .gauge-ring svg{transform:rotate(-90deg)}
  .gauge-pct{position:absolute;inset:0;display:grid;place-items:center;font-family:'Poppins';font-weight:700;font-size:14px}
  .gauge-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gauge-sub{font-size:9.5px;color:var(--txt-3);font-family:'JetBrains Mono';max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hg-edit{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--txt-3);cursor:pointer;display:grid;place-items:center;flex:none}
  .hg-edit:hover{border-color:var(--accent);color:var(--accent-hi)}
  .hg-edit svg{width:15px;height:15px}

  /* dashboard grid */
  .dash-grid{display:grid;gap:18px;margin-top:8px;grid-template-columns:1fr 340px;align-items:start}
  .dash-2x2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:760px){.dash-2x2{grid-template-columns:1fr}}
  .dash-2x2 .section{height:360px;display:flex;flex-direction:column;overflow:hidden}
  .dash-2x2 .card-scroll{flex:1;overflow-y:auto;min-height:0}
  .dotrow{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
  .gdot{width:9px;height:9px;border-radius:50%;flex:none}
  .songs-row{display:flex;align-items:center;gap:12px;padding:8px 20px;cursor:pointer;transition:background .12s}
  .songs-row:hover{background:var(--hover)}
  .song-artmini{width:38px;height:38px;border-radius:8px;flex:none;background:var(--card-hi);overflow:hidden;display:grid;place-items:center;color:var(--txt-3);font-family:'Poppins';font-weight:700;font-size:14px}
  .song-artmini img{width:100%;height:100%;object-fit:cover}
  .dseq-block{position:relative;flex-basis:0;border-radius:5px;overflow:hidden;min-width:4px}
  .dseq-wave{position:absolute;inset:0;display:flex;align-items:center;gap:1px;padding:0 3px;opacity:.3}
  .dseq-wave .dwb{flex:1 1 0;background:#fff;border-radius:1px;min-width:1px}
  .dseq-ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.85);font-size:13px}
  .dash-main{display:flex;flex-direction:column;gap:18px;min-width:0}
  .dash-rail{display:flex;flex-direction:column;gap:18px;min-height:0}
  /* Desktop only: cap Activity to the exact height of the left column's 3 rows
     (3 boxes of 360 + 2 gaps of 18) so it scrolls internally, no dead space */
  @media(min-width:1025px){
    .dash-rail{height:calc(360px * 3 + 18px * 2)}
    .dash-rail>.section{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
    .dash-rail>.section>.card-scroll{flex:1;overflow:hidden;min-height:0}
    .dash-rail>.section>.sec-foot{flex:none}
  }
  .section{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--line-soft);overflow:hidden}
  .sec-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px}
  .sec-head .lt{display:flex;align-items:center;gap:11px}
  .sec-head .ic{width:30px;height:30px;border-radius:9px;flex:none;background:var(--accent-dim);display:grid;place-items:center;color:var(--accent-hi)}
  .sec-head .ic svg{width:17px;height:17px}
  .sec-head .cnt{color:var(--txt-3);font-size:12.5px;margin-top:1px}
  .expand{display:flex;align-items:center;gap:6px;background:transparent;border:none;color:var(--txt-3);font-family:inherit;font-weight:600;font-size:12.5px;cursor:pointer;padding:6px 10px;border-radius:8px;transition:.14s}
  .expand:hover{background:var(--hover);color:var(--txt)}
  .expand svg{width:14px;height:14px}

  .song-row{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:14px;padding:9px 20px;cursor:pointer;transition:.12s}
  .song-row:hover{background:var(--hover)}
  .song-row .idx{color:var(--txt-3);font-size:13px;text-align:center;font-family:'JetBrains Mono'}
  .song-row .sname{min-width:0}
  .song-row .sname .st{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .song-row .sname .parts{color:var(--txt-3);font-size:11.5px;margin-top:3px}
  .song-prog{display:flex;align-items:center;gap:10px}
  .pbar{width:110px;height:6px;border-radius:4px;background:var(--grey);overflow:hidden}
  .pbar .fill{height:100%;border-radius:4px}
  .pct-sm{font-family:'JetBrains Mono';font-size:12px;color:var(--txt-2);width:36px;text-align:right}
  .sec-foot{padding:8px 20px 16px}
  .sec-foot .expand{padding-left:0}

  /* waiting on panel */
  .wait-row{display:flex;align-items:center;gap:12px;padding:11px 20px;border-top:1px solid var(--line-soft)}
  .wait-row:first-of-type{border-top:none}
  .wait-av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
  .wait-info{flex:1;min-width:0}
  .wait-info .wn{font-weight:600;font-size:13px}
  .wait-info .wt{color:var(--txt-3);font-size:11.5px;margin-top:2px}
  .wait-count{background:var(--accent-dim);color:var(--accent-hi);font-weight:700;font-size:12px;padding:3px 9px;border-radius:20px;font-family:'JetBrains Mono'}

  /* activity feed */
  .act-row{display:flex;gap:12px;padding:11px 20px;border-top:1px solid var(--line-soft)}
  .act-row:first-of-type{border-top:none}
  .act-dot{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff}
  .act-body{flex:1;min-width:0}
  .act-body .at{font-size:12.5px;line-height:1.4}
  .act-body .at b{font-weight:600}
  .act-body .atime{color:var(--txt-3);font-size:11px;margin-top:2px;font-family:'JetBrains Mono'}
  .act-row.clickable{cursor:pointer;transition:background .12s}
  .act-row.clickable:hover{background:var(--hover)}
  /* notifications dropdown */
  .notif-bell{position:relative}
  .notif-dot{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:#3ECF8E;border:2px solid var(--panel);box-shadow:0 0 6px rgba(62,207,142,.8)}
  .notif-drop{position:absolute;top:42px;right:0;width:350px;max-height:64vh;overflow-y:auto;background:var(--card-hi);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 18px 50px rgba(0,0,0,.6);z-index:80}
  .notif-drop .nd-head{padding:12px 16px;font-family:'Poppins';font-weight:600;font-size:14px;border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--card-hi)}
  .notif-drop .nd-row{display:flex;gap:12px;padding:11px 16px;border-top:1px solid var(--line-soft);cursor:pointer;transition:background .12s}
  .notif-drop .nd-row:hover{background:var(--hover)}
  .notif-drop .nd-empty{padding:22px 16px;color:var(--txt-3);font-size:12.5px;text-align:center}
  .notif-drop .nd-foot{padding:11px 16px;border-top:1px solid var(--line-soft);color:var(--accent-hi);font-weight:600;font-size:12.5px;cursor:pointer;text-align:center;position:sticky;bottom:0;background:var(--card-hi)}
  .notif-drop .nd-foot:hover{background:var(--hover)}

  /* schedule mini */
  .sched-row{display:flex;align-items:center;gap:14px;padding:11px 20px;transition:.12s;cursor:pointer}
  .sched-row:hover{background:var(--hover)}
  .date-chip{width:48px;flex:none;text-align:center;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);padding:7px 0}
  .date-chip .mo{font-size:10px;color:var(--accent-hi);font-weight:700;text-transform:uppercase}
  .date-chip .dy{font-family:'Poppins';font-weight:700;font-size:18px;line-height:1;margin-top:1px}
  .sched-row .info{flex:1;min-width:0}
  .sched-row .info .tt{font-weight:600;font-size:13.5px}
  .sched-row .info .meta{color:var(--txt-3);font-size:11.5px;margin-top:2px;display:flex;align-items:center;gap:6px}
  .tag{padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;flex:none}
  .tag.due{background:rgba(245,166,35,.14);color:var(--amber)}
  .tag.done{background:rgba(62,207,142,.14);color:var(--green)}
  .tag.up{background:var(--accent-dim);color:var(--accent-hi)}

  /* artwork/merch rows */
  .slot-grid{display:grid;gap:12px;padding:0 20px 20px}
  .slot{border-radius:var(--r-md);overflow:hidden;aspect-ratio:1;background:var(--panel-2);border:1.5px dashed var(--line);cursor:pointer;display:grid;place-items:center;position:relative;transition:.16s}
  .slot:hover{border-color:var(--accent);background:#191316}
  .slot img{width:100%;height:100%;object-fit:cover}
  .slot .m-drop{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--txt-3);text-align:center;padding:12px}
  .slot .m-drop svg{width:22px;height:22px}
  .slot .m-drop .lbl{font-size:11px;font-weight:600;color:var(--txt-2)}
  .slot .m-drop .sm{font-size:10px;color:var(--txt-3)}
  .slot .m-label{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 9px;font-size:11.5px;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.8));opacity:0;transition:.16s}
  .slot.filled:hover .m-label{opacity:1}
  .slot.is-cover{border-style:solid;border-color:var(--accent);background:#20140f}
  .cover-badge{position:absolute;top:8px;left:8px;z-index:3;background:var(--accent);color:#fff;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:6px}
  .slot .replace{position:absolute;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;color:#fff;opacity:0;transition:.16s}
  .slot.filled:hover .replace{opacity:1}
  .slot .replace svg{width:22px;height:22px}

  /* ===== WORKSPACE VIEWS ===== */
  .ws-head{padding:24px 0 20px}
  .ws-head .view-title{font-size:32px;margin-top:6px}
  .ws-head .ws-sub{color:var(--txt-2);font-size:14px;margin-top:8px;max-width:64ch;line-height:1.5}

  /* recording grid */
  .grid-wrap{overflow-x:auto;overflow-y:visible;border-radius:var(--r-md);border:1px solid var(--line-soft);background:var(--card);scrollbar-color:var(--accent) var(--panel-2);scrollbar-width:auto}
  .grid-wrap::-webkit-scrollbar{height:14px}
  .grid-wrap::-webkit-scrollbar-track{background:var(--panel-2);border-radius:0 0 var(--r-md) var(--r-md)}
  .grid-wrap::-webkit-scrollbar-thumb{background:var(--accent);border-radius:8px;border:3px solid var(--panel-2);background-clip:padding-box}
  .grid-wrap::-webkit-scrollbar-thumb:hover{background:var(--accent-hi);background-clip:padding-box;border:3px solid var(--panel-2)}
  .grid-scroll-hint{display:flex;align-items:center;gap:7px;color:var(--accent-hi);font-size:12px;font-weight:600;margin:8px 2px 0}
  .grid-scroll-hint svg{width:14px;height:14px}
  table.rec-grid{border-collapse:collapse;width:100%;table-layout:fixed}
  .rec-grid th,.rec-grid td{border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
  .rec-grid thead th{position:sticky;top:0;background:var(--panel-2);z-index:2;padding:14px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--txt-2)}
  .rec-grid thead th.songcol{text-align:left;padding-left:20px;width:190px}
  .rec-grid tbody td.songcol{text-align:left;padding:0 20px;font-weight:600;font-size:13.5px;background:var(--panel-2);position:sticky;left:0;cursor:pointer;width:190px}
  .rec-grid tbody td.songcol:hover{color:var(--accent-hi)}
  .rec-grid tbody td{height:68px;text-align:center;padding:0}
  .cell{position:relative;width:100%;height:100%;display:grid;place-items:center;cursor:pointer;transition:.12s}
  .cell:hover{filter:brightness(1.35)}
  .cell.dim{opacity:.24;filter:grayscale(.6)}
  .cell.dim:hover{opacity:.5}
  /* per-cell assignee badge (bottom-right) + hover assign button (top-right) */
  .cell-av{border-radius:50%;display:inline-grid;place-items:center;font-size:9px;font-weight:700;color:#fff;overflow:hidden;flex:none;line-height:1}
  .cell-av .av-img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  .cell-av.more{background:#2a2a30;color:var(--txt-2);font-size:8.5px}
  .cell-avstack{position:absolute;right:5px;bottom:5px;display:inline-flex;flex-direction:row;pointer-events:none;z-index:1}
  .cell-avstack .cell-av{margin-left:-6px;box-shadow:0 0 0 2px var(--panel)}
  .cell-avstack .cell-av:first-child{margin-left:0}
  .cell-assign{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(20,20,23,.72);backdrop-filter:blur(3px);color:var(--txt-2);cursor:pointer;display:grid;place-items:center;opacity:0;transition:.12s;z-index:2}
  .cell-assign svg{width:13px;height:13px}
  .cell:hover .cell-assign{opacity:1}
  .cell-assign:hover{background:var(--accent);color:#fff}
  /* filter-by-member bar */
  .assign-filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .afl-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--txt-3);margin-right:2px}
  .afl-chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 6px;border-radius:20px;border:1px solid var(--line);background:var(--panel-2,#1a1a1f);color:var(--txt-2);font-size:12.5px;font-weight:600;cursor:pointer;transition:.12s}
  .afl-chip .afl-all{padding:0 4px}
  .afl-chip:hover{border-color:var(--txt-3);color:var(--txt)}
  .afl-chip.on{border-color:var(--accent);background:var(--accent-dim);color:var(--accent-hi)}
  /* assign popover menu */
  .assign-menu{position:fixed;z-index:120;width:232px;max-height:60vh;overflow-y:auto;background:var(--panel,#1a1a1f);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 46px rgba(0,0,0,.55);padding:6px}
  .assign-menu .am-head{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt-3);padding:8px 10px 6px;display:flex;flex-direction:column;gap:3px}
  .assign-menu .am-hint{text-transform:none;letter-spacing:0;font-size:11px;color:var(--txt-3);font-weight:500}
  .assign-menu .am-row{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border:none;background:transparent;color:var(--txt);font-size:13.5px;font-weight:600;cursor:pointer;border-radius:8px;text-align:left}
  .assign-menu .am-row:hover{background:var(--hover)}
  .assign-menu .am-row.on{background:var(--accent-dim)}
  .assign-menu .am-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .assign-menu .am-box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;flex:none}
  .assign-menu .am-box.all{background:var(--accent);border-color:var(--accent)}
  .assign-menu .am-box.some{background:transparent;border-color:var(--accent);color:var(--accent-hi)}
  .assign-menu .am-check{color:var(--accent-hi);font-weight:800}
  .assign-menu .am-done{width:100%;margin-top:6px;padding:9px;border:none;border-top:1px solid var(--line-soft);background:transparent;color:var(--accent-hi);font-weight:700;font-size:13px;cursor:pointer;border-radius:0 0 10px 10px}
  .assign-menu .am-done:hover{background:var(--hover)}
  .assign-menu .am-clear{border-top:1px solid var(--line-soft);margin-top:4px;color:var(--txt-2)}
  .assign-menu .am-x{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--hover);color:var(--txt-3);font-size:11px;flex:none}
  .assign-menu .am-empty{padding:10px;font-size:12.5px;color:var(--txt-3);line-height:1.5}
  /* my-tasks panel */
  .task-song{padding:11px 20px;border-top:1px solid var(--line-soft)}
  .task-song:first-of-type{border-top:none}
  .ts-name{font-size:13px;font-weight:700;color:var(--txt);cursor:pointer;display:flex;align-items:center;gap:8px}
  .ts-name:hover{color:var(--accent-hi)}
  .ts-count{background:var(--accent-dim);color:var(--accent-hi);font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;font-family:'JetBrains Mono'}
  .ts-parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .ts-part{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:14px;background:var(--panel-2,#1a1a1f);border:1px solid var(--line);font-size:11.5px;color:var(--txt-2);cursor:pointer}
  .ts-part:hover{border-color:var(--txt-3);color:var(--txt)}
  .ts-dot{width:8px;height:8px;border-radius:50%;flex:none}
  .wait-row.unassigned .wait-av.ua{background:transparent;border:1.5px dashed var(--line);color:var(--txt-3)}
  .wait-row[onclick]{cursor:pointer}
  .wait-row[onclick]:hover{background:var(--hover)}
  .cell .mark{width:52px;height:52px;border-radius:11px;display:grid;place-items:center}
  .cell .mark svg{width:30px;height:30px}
  .cell .mark.mark-empty{background:transparent;border:1.5px dashed #38383f}
  .cell .mark.mark-na{background:transparent;border:1.5px solid var(--line);color:var(--txt-3);opacity:.6}
  .rec-grid thead th.instcol{position:relative;white-space:nowrap}
  .rec-grid thead th.instcol .inst-name{display:inline-block;max-width:120px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
  /* on hover the column tools float as a compact bar anchored in the header —
     so 5 buttons never get clipped by a narrow (13-column) grid, no layout shift */
  .rec-grid thead th.instcol .inst-tools{display:none;align-items:center;gap:2px}
  .rec-grid thead th.instcol:hover .inst-tools{display:inline-flex;position:absolute;left:50%;bottom:5px;transform:translateX(-50%);background:var(--card-hi);border:1px solid var(--line);border-radius:8px;padding:3px;box-shadow:0 6px 18px rgba(0,0,0,.5);z-index:6}
  .rec-grid thead th.instcol .inst-tools button{background:transparent;border:none;color:var(--txt-3);cursor:pointer;padding:2px;border-radius:5px;display:grid;place-items:center}
  .rec-grid thead th.instcol .inst-tools button:hover{background:var(--hover);color:var(--txt)}
  .rec-grid thead th.instcol .inst-tools button svg{width:13px;height:13px}
  .rec-grid th.addcol,.rec-grid td.addcol{width:46px;background:var(--panel-2)}
  .add-inst{width:28px;height:28px;border-radius:8px;border:1.5px dashed var(--line);background:transparent;color:var(--txt-3);cursor:pointer;display:grid;place-items:center;margin:0 auto}
  .add-inst:hover{border-color:var(--accent);color:var(--accent-hi)}
  .add-inst svg{width:15px;height:15px}
  .legend .sw{width:16px;height:16px;border-radius:6px}
  /* status manager */
  .status-edit{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;border:1px solid var(--line-soft);border-radius:10px;margin-bottom:8px;background:var(--panel-2)}
  .se-move{display:flex;flex-direction:column;gap:2px;flex:none}
  .se-move button{width:22px;height:15px;border:1px solid var(--line);background:var(--card);color:var(--txt-2);cursor:pointer;border-radius:4px;display:grid;place-items:center;padding:0}
  .se-move button:disabled{opacity:.3;cursor:default}
  .se-move button svg{width:11px;height:11px}
  .se-color{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer;padding:2px;flex:none}
  .se-name{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:9px 11px;font-size:13px;outline:none;font-family:inherit}
  .se-name:focus{border-color:var(--accent)}
  .se-na{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--txt-2);cursor:pointer;white-space:nowrap;flex:none}
  .se-del{background:transparent;border:none;color:var(--txt-3);cursor:pointer;padding:6px;border-radius:6px;flex:none}
  .se-del:hover{color:#e0322a;background:var(--hover)}
  .se-del svg{width:15px;height:15px}
  .se-del:disabled{opacity:.3;cursor:default}
  .se-icons{display:flex;gap:5px;flex-wrap:wrap;flex-basis:100%;margin-top:2px}
  .se-icons button{width:32px;height:32px;border:1px solid var(--line);background:var(--card);color:var(--txt-2);cursor:pointer;border-radius:7px;display:grid;place-items:center;padding:0}
  .se-icons button.on{border-color:var(--accent);color:var(--accent-hi);background:var(--accent-dim)}
  .se-icons button svg{width:16px;height:16px}
  .rec-grid tbody td.songcol{display:flex;align-items:center;gap:6px;cursor:default}
  .rec-grid td.songcol .sc-name{cursor:pointer;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rec-grid td.songcol .sc-name:hover{color:var(--accent-hi)}
  .song-del{background:transparent;border:none;color:var(--txt-3);cursor:pointer;padding:4px;border-radius:6px;opacity:0;transition:.12s;display:grid;place-items:center;flex:none}
  .song-del svg{width:14px;height:14px}
  .song-del:hover{color:#e0322a;background:var(--hover)}
  tr:hover .song-del,.idea-head:hover .song-del{opacity:1}
  .song-assign{background:transparent;border:none;color:var(--txt-3);cursor:pointer;padding:4px;border-radius:6px;opacity:0;transition:.12s;display:grid;place-items:center;flex:none}
  .song-assign svg{width:14px;height:14px}
  .song-assign:hover{color:var(--accent-hi);background:var(--hover)}
  tr:hover .song-assign{opacity:1}
  .rec-grid tbody tr td{transition:background .3s}
  .rec-grid tbody tr.grid-row-flash td{background:rgba(255,77,28,.14)}
  .rec-grid tbody tr.grid-row-flash td.songcol{color:var(--accent-hi)}
  .legend{display:flex;gap:20px;flex-wrap:wrap;margin:20px 2px 0;font-size:12px;color:var(--txt-2)}
  .legend .li{display:flex;align-items:center;gap:8px}
  .legend .sw{width:16px;height:16px;border-radius:6px}

  /* song ideas / audio player */
  .idea-song{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-lg);margin-top:16px;overflow:hidden;transition:box-shadow .16s,border-color .16s,background .16s}
  /* an EXPANDED song stands out: lighter card, accent border + left bar, tinted header */
  .idea-song[data-song]:not(.collapsed){background:var(--card-hi);border-color:var(--accent);box-shadow:inset 4px 0 0 -1px var(--accent),0 12px 34px rgba(0,0,0,.32)}
  .idea-song[data-song]:not(.collapsed)>.idea-head{background:var(--accent-dim)}
  .idea-song[data-song]:not(.collapsed)>.idea-head:hover{background:var(--accent-dim)}
  .idea-song[data-song]:not(.collapsed) .idea-title{color:#fff}
  .idea-song[data-song]:not(.collapsed) .idea-num{color:var(--accent-hi)}
  .idea-head{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;user-select:none;transition:.14s}
  .idea-head:hover{background:var(--panel-2)}
  .idea-num{font-family:'JetBrains Mono';font-size:13px;color:var(--txt-3);width:24px;flex:none}
  .idea-title{font-family:'Poppins';font-weight:600;font-size:16px;flex:1}
  .cnt-pill{background:var(--panel-2);border:1px solid var(--line);padding:3px 10px;border-radius:20px;font-weight:600;font-size:11.5px;display:flex;align-items:center;gap:6px;color:var(--txt-3)}
  .cnt-pill.has{color:var(--accent-hi);border-color:rgba(255,77,28,.3)}
  .cnt-pill svg{width:12px;height:12px}
  .idea-body{padding:2px 16px 16px;border-top:1px solid var(--line-soft)}
  /* Idea bank: a real section (header breaks OUT of any box), then one collapsible row per idea */
  .bank-sec{margin-top:40px;border-top:1px solid var(--line-soft);padding-top:26px}
  .bank-sec-head{display:flex;align-items:center;gap:14px;padding:0 4px 2px}
  .bank-sec-ic{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;background:rgba(255,77,28,.12);color:var(--accent);border:1px solid rgba(255,77,28,.28)}
  .bank-sec-ic svg{width:19px;height:19px}
  .bank-sec-title{font-family:'Poppins';font-weight:600;font-size:19px;letter-spacing:-.01em}
  .bank-sec-sub{color:var(--txt-3);font-size:12px;margin-top:2px;line-height:1.45;max-width:640px}
  .bank-list{display:flex;flex-direction:column;margin-top:6px}
  .idea-song[data-bank] .idea-num{color:var(--accent)}
  .idea-song[data-bank]:not(.collapsed){background:var(--card-hi);border-color:var(--accent);box-shadow:inset 4px 0 0 -1px var(--accent),0 12px 34px rgba(0,0,0,.32)}
  .idea-song[data-bank]:not(.collapsed)>.idea-head{background:var(--accent-dim)}
  .idea-song[data-bank]:not(.collapsed)>.idea-head:hover{background:var(--accent-dim)}
  .idea-song[data-bank]:not(.collapsed) .idea-title{color:#fff}
  .idea-song[data-bank]:not(.collapsed) .idea-num{color:var(--accent-hi)}
  .dropzone{margin:14px 4px 4px;border:1.5px dashed var(--line);border-radius:var(--r-md);padding:22px;text-align:center;cursor:pointer;transition:.16s;color:var(--txt-3)}
  .dropzone:hover,.dropzone.drag{border-color:var(--accent);background:rgba(255,77,28,.05);color:var(--txt-2)}
  .dropzone .dz-ic{width:40px;height:40px;border-radius:11px;margin:0 auto 10px;background:var(--accent-dim);color:var(--accent-hi);display:grid;place-items:center}
  .dropzone.drag .dz-ic{background:var(--accent);color:#fff}
  .dropzone .dz-ic svg{width:20px;height:20px}
  .dropzone .big{font-weight:600;color:var(--txt-2);font-size:13.5px}
  .dropzone .sm{font-size:12px;margin-top:3px}
  .tracks{display:flex;flex-direction:column;gap:8px;margin:12px 4px 4px}
  .track{display:flex;align-items:center;gap:14px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:11px 14px;transition:.14s}
  .track.playing{border-color:rgba(255,77,28,.4);background:#1b1512}
  .track.master{border-color:rgba(255,77,28,.55);background:#1d1410}
  .master-badge{font-family:'JetBrains Mono';font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:5px;background:var(--accent);color:#fff;flex:none}
  .ico-btn.is-master{color:var(--accent-hi)}
  .play-btn{width:40px;height:40px;border-radius:50%;flex:none;border:none;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center;transition:.14s}
  .play-btn:hover{background:var(--accent-hi)}
  .play-btn svg{width:18px;height:18px}
  .play-btn .pause-ic{display:none}
  .track.playing .play-btn .play-ic{display:none}
  .track.playing .play-btn .pause-ic{display:block}
  .track-main{flex:1;min-width:0}
  .track-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .track-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* file title (primary) + raw filename (secondary) + upload date */
  .track-names{display:flex;align-items:baseline;gap:8px;min-width:0;overflow:hidden}
  .track-title{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}
  .track-file{font-size:11px;color:var(--txt-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;max-width:230px}
  .track-rename{background:transparent;border:none;color:var(--txt-3);cursor:pointer;padding:3px;border-radius:5px;display:grid;place-items:center;flex:none;opacity:0;transition:.12s}
  .track-rename svg{width:13px;height:13px}
  .track:hover .track-rename{opacity:1}
  .track-rename:hover{color:var(--accent-hi);background:var(--hover)}
  .track-date{font-family:'JetBrains Mono';font-size:10.5px;color:var(--txt-3);margin-left:auto;flex:none;white-space:nowrap}
  .fmt-tag{font-family:'JetBrains Mono';font-size:9.5px;font-weight:600;padding:2px 6px;border-radius:5px;flex:none;text-transform:uppercase}
  .fmt-tag.wav{background:rgba(62,207,142,.15);color:var(--green)}
  .fmt-tag.mp3{background:rgba(245,166,35,.15);color:var(--amber)}
  .fmt-tag.m4a{background:rgba(78,168,232,.15);color:var(--blue)}
  .track-note{color:var(--txt-3);font-size:11px;margin-left:auto;flex:none}
  .scrub{display:flex;align-items:center;gap:12px}
  .wave{flex:1;height:34px;position:relative;cursor:pointer;display:flex;align-items:center;gap:1px;overflow:visible;touch-action:none}
  .wave .bar{pointer-events:none}
  /* SoundCloud-style timestamped comment markers on the waveform */
  .wave-mark{position:absolute;top:-5px;transform:translateX(-50%);width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:8.5px;font-weight:700;color:#fff;cursor:pointer;z-index:4;border:1.5px solid var(--panel-2);box-shadow:0 1px 4px rgba(0,0,0,.55);font-family:'Inter'}
  .wave-mark:hover{transform:translateX(-50%) scale(1.18);z-index:8}
  .wave-mark .wm-pop{display:none;position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card-hi);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:11.5px;color:var(--txt);width:200px;line-height:1.4;box-shadow:0 10px 28px rgba(0,0,0,.55);z-index:12;white-space:normal;text-align:left;pointer-events:none}
  .wave-mark:hover .wm-pop,.wave-mark.wm-show .wm-pop{display:block}
  .wave-mark.wm-show{transform:translateX(-50%) scale(1.18);z-index:9}
  .wave-mark .wm-pop b{color:var(--accent-hi)}
  .wave .bar{flex:1 1 0;background:var(--grey);border-radius:1px;min-width:1px;transition:background .05s}
  .wave .bar.on{background:var(--accent)}
  .time{font-family:'JetBrains Mono';font-size:11.5px;color:var(--txt-2);flex:none;width:80px;text-align:right}
  .time .cur{color:var(--txt)}
  .track-actions{display:flex;align-items:center;gap:2px;flex:none}
  .ico-btn{width:32px;height:32px;border-radius:8px;border:none;background:transparent;color:var(--txt-3);cursor:pointer;display:grid;place-items:center;transition:.13s}
  .ico-btn:hover{background:var(--hover);color:var(--txt)}
  .ico-btn.grid-ico{color:#fff;background:var(--accent)}
  .ico-btn.grid-ico:hover{background:var(--accent-hi);color:#fff}
  .ico-btn svg{width:16px;height:16px}
  .empty-note{color:var(--txt-3);font-size:12.5px;text-align:center;padding:8px 0 2px;font-style:italic}
  /* per-file comments, attached under each track */
  .track-group{display:flex;flex-direction:column;min-width:0}
  .bank-file{padding-bottom:20px;border-bottom:1px solid var(--line-soft);margin-bottom:14px}
  .bank-file:last-child{border-bottom:none;padding-bottom:2px;margin-bottom:0}
  .track-group .track{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:none}
  .track-cmts{background:var(--panel-2);border:1px solid var(--line-soft);border-top:1px dashed var(--line);border-radius:0 0 var(--r-md) var(--r-md);padding:6px 14px 10px}
  .track-cmts .cmt-row{padding:8px 0}
  .tc-empty{color:var(--txt-3);font-size:11.5px;font-style:italic;padding:8px 0 6px}
  .tc-add{display:flex;gap:8px;margin-top:6px}
  .tc-add input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px 10px;font-family:inherit;font-size:12.5px;outline:none}
  .tc-add input:focus{border-color:var(--accent)}
  /* idea labels (section + instrument tags) */
  .label-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px}
  .lchip{padding:3px 9px;border-radius:20px;border:1px solid var(--line);background:var(--panel-2);color:var(--txt-2);font-size:10.5px;font-weight:600;cursor:pointer;transition:.12s;font-family:inherit;white-space:nowrap}
  .lchip:hover{border-color:var(--txt-2)}
  .lchip.on{background:var(--accent-dim);border-color:rgba(255,77,28,.4);color:var(--accent-hi)}
  .ltag-btn{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;border:1px dashed var(--line);background:transparent;color:var(--txt-3);font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .ltag-btn:hover{border-color:var(--accent);color:var(--txt-2)}
  .ltag-btn svg{width:11px;height:11px}
  .label-palette{flex-basis:100%;margin-top:6px;padding:10px 12px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;display:flex;flex-direction:column;gap:8px}
  .lp-group{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
  .lp-h{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--txt-3);width:74px;flex:none;padding-top:4px}
  .lp-chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .lp-manage{margin-top:2px;border-top:1px solid var(--line-soft);padding-top:8px}
  .lp-manage button{background:transparent;border:none;color:var(--txt-3);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;padding:2px}
  .lp-manage button:hover{color:var(--accent-hi)}
  .tag-edit-wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .tag-edit{display:inline-flex;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;overflow:hidden}
  .tag-edit .te-name{background:transparent;border:none;color:var(--txt-2);font-weight:600;font-size:12px;padding:6px 4px 6px 12px;cursor:pointer;font-family:inherit}
  .tag-edit .te-name:hover{color:var(--accent-hi)}
  .tag-edit .te-x{background:transparent;border:none;color:var(--txt-3);cursor:pointer;padding:6px 10px 6px 4px;font-size:15px;line-height:1}
  .tag-edit .te-x:hover{color:#e0322a}
  .te-add{background:var(--panel-2);border:1px dashed var(--line);border-radius:20px;color:var(--txt);padding:6px 13px;font-size:12px;outline:none;font-family:inherit;width:96px}
  .te-add:focus{border-color:var(--accent)}
  .assign-list{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow-y:auto}
  .assign-row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:var(--r-md);color:var(--txt);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:.12s;text-align:left}
  .assign-row:hover{background:var(--hover);border-color:var(--accent)}
  .assign-row .ol-num{font-family:'JetBrains Mono';font-size:12px;color:var(--txt-3);width:22px}
  .assign-row svg{width:16px;height:16px;color:var(--txt-3)}

  /* sequencer */
  .transport{display:flex;align-items:center;gap:16px;margin:8px 0 14px;background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:16px 20px}
  .big-play{width:50px;height:50px;border-radius:50%;flex:none;border:none;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center;transition:.14s}
  .big-play:hover{background:var(--accent-hi)}
  .big-play svg{width:21px;height:21px}
  .big-play .pause-ic{display:none}
  body.seqplaying .big-play .play-ic{display:none}
  body.seqplaying .big-play .pause-ic{display:block}
  .transport-info{flex:1;min-width:0}
  .transport-info .now{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:10px}
  .now .swatch{width:11px;height:11px;border-radius:3px;flex:none}
  .transport-info .sub2{color:var(--txt-3);font-size:12px;margin-top:3px}
  .transport-times{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono';font-size:14px;flex:none}
  .transport-times .cur{color:var(--txt)}.transport-times .tot{color:var(--txt-3)}
  .seq-wrap{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:20px;overflow:hidden}
  .ruler{display:flex;height:18px;margin-bottom:8px;padding:0 2px}
  .ruler .tick{flex:1;border-left:1px solid var(--line-soft);font-family:'JetBrains Mono';font-size:9.5px;color:var(--txt-3);padding-left:4px;padding-top:2px}
  .ruler .tick:first-child{border-left:none}
  .timeline{position:relative;height:104px;padding:0;border-radius:var(--r-md);background:var(--panel-2);border:1px solid var(--line-soft)}
  .block{position:absolute;top:3px;bottom:3px;display:flex;flex-direction:column;justify-content:space-between;padding:9px 11px;cursor:grab;overflow:hidden;user-select:none;border-radius:var(--r-sm);transition:left .22s cubic-bezier(.2,.85,.25,1),width .22s cubic-bezier(.2,.85,.25,1),transform .12s,box-shadow .15s,filter .12s;min-width:30px}
  .block.is-first{border-top-left-radius:var(--r-sm);border-bottom-left-radius:var(--r-sm)}
  .block.is-last{border-top-right-radius:var(--r-sm);border-bottom-right-radius:var(--r-sm);border-right:none}
  .block:hover{filter:brightness(1.08)}
  .block.dragging{opacity:.35;cursor:grabbing}
  .block.seq-lift{z-index:20;cursor:grabbing;box-shadow:0 14px 34px rgba(0,0,0,.6);filter:brightness(1.12);pointer-events:none;transition:none}
  .block.drag-over-left{box-shadow:inset 4px 0 0 #fff}
  .block.drag-over-right{box-shadow:inset -4px 0 0 #fff}
  .block.no-audio{opacity:.5;background:repeating-linear-gradient(135deg,#2a2a30,#2a2a30 8px,#232329 8px,#232329 16px)!important}
  .block .no-audio-tag{position:absolute;top:26px;left:11px;font-family:'JetBrains Mono';font-size:9px;font-weight:700;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.05em;z-index:2}
  .block.placeholder{display:flex;flex-direction:column;justify-content:space-between}
  .block.placeholder .ph-label{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;gap:5px;font-family:'JetBrains Mono';font-size:9.5px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .block .ph-x{position:absolute;top:5px;right:5px;z-index:4;width:18px;height:18px;border-radius:5px;border:none;background:rgba(0,0,0,.35);color:#fff;cursor:pointer;display:none;place-items:center;padding:0}
  .block .ph-x svg{width:11px;height:11px}
  .block.placeholder:hover .ph-x{display:grid}
  .block .ph-edit{right:27px}
  .ol-row.placeholder .ol-name{font-style:italic}
  .ph-x.sm{background:transparent;border:none;color:var(--txt-3);cursor:pointer;padding:4px;border-radius:6px;display:grid;place-items:center;flex:none}
  .ph-x.sm svg{width:14px;height:14px}
  .ph-x.sm:hover{color:#e0322a;background:var(--hover)}
  .seq-hint{display:flex;align-items:center;gap:8px;color:var(--txt-3);font-size:12px;font-weight:500;margin:2px 2px 12px}
  .seq-hint svg{width:14px;height:14px;color:var(--accent-hi)}
  .block.current{box-shadow:0 0 0 2px #fff,0 6px 20px rgba(0,0,0,.5);z-index:3}
  .block .b-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;z-index:2}
  .block .b-num{font-family:'JetBrains Mono';font-weight:700;font-size:11px;color:rgba(255,255,255,.75)}
  .block .b-dur{font-family:'JetBrains Mono';font-size:10px;color:rgba(255,255,255,.7);white-space:nowrap}
  .block .b-name{font-weight:700;font-size:12.5px;color:#fff;line-height:1.15;z-index:2;text-shadow:0 1px 3px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .block .b-wave{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;gap:1px;padding:0 8px;opacity:.32;z-index:1}
  .block .b-wave .wb{flex:1 1 0;background:#fff;border-radius:1px;min-width:1px}
  .playhead{position:absolute;top:2px;bottom:2px;width:2px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.8);z-index:5;pointer-events:none;display:none;border-radius:2px}
  body.seqplaying .playhead{display:block}
  .seq-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;flex-wrap:wrap;gap:12px}
  .stat-run{display:flex;gap:22px}
  .stat-run .s .n{font-family:'Poppins';font-weight:700;font-size:18px}
  .stat-run .s .l{color:var(--txt-3);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-top:1px}

  /* order list */
  .order-list{margin-top:22px;display:flex;flex-direction:column;gap:6px}
  .ol-head{color:var(--txt-3);font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:4px;padding-left:4px}
  .ol-row{display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:var(--r-md);transition:background .12s,border-color .12s;touch-action:none}
  .ol-row.current{border-color:rgba(255,77,28,.5);background:#1b1512}
  .ol-row.ol-lift{z-index:20;box-shadow:0 12px 30px rgba(0,0,0,.55);border-color:var(--accent);background:#1d1410;transition:none}
  .ol-row.ol-over-top{box-shadow:inset 0 3px 0 var(--accent)}
  .ol-row.ol-over-bot{box-shadow:inset 0 -3px 0 var(--accent)}
  .ol-row.no-audio{opacity:.6}
  .ol-grip{display:grid;place-items:center;color:var(--txt-3);cursor:grab;flex:none;width:18px}
  .ol-grip svg{width:16px;height:16px}
  .ol-row:hover .ol-grip{color:var(--txt-2)}
  .ol-noaudio{font-family:'JetBrains Mono';font-size:9.5px;font-weight:700;color:var(--txt-3);text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  .ol-row .ol-num{font-family:'JetBrains Mono';font-size:12px;color:var(--txt-3);width:22px}
  .ol-row .ol-sw{width:10px;height:10px;border-radius:3px;flex:none}
  .ol-row .ol-name{flex:1;font-weight:600;font-size:13.5px}
  .ol-row .ol-name:hover{color:var(--accent-hi)}
  .ol-row .ol-dur{font-family:'JetBrains Mono';font-size:12px;color:var(--txt-2)}

  /* timeline (schedule full) */
  .timeline-v{position:relative;padding-left:8px;margin-top:8px}
  .tl-row{display:flex;gap:20px}
  .tl-mark{display:flex;flex-direction:column;align-items:center;flex:none;width:20px}
  .tl-dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--base);margin-top:20px}
  .tl-line{width:2px;flex:1;background:var(--line)}
  .tl-card{flex:1;background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:16px 18px;margin-bottom:14px;display:flex;align-items:center;gap:16px}
  .tl-card .d{text-align:center;flex:none;width:56px}
  .tl-card .d .mo{color:var(--accent-hi);font-weight:700;font-size:11px;text-transform:uppercase}
  .tl-card .d .dy{font-family:'Poppins';font-weight:700;font-size:24px;line-height:1}
  .tl-card .d .yr{color:var(--txt-3);font-size:11px;font-family:'JetBrains Mono'}
  .tl-card .body{flex:1}
  .tl-card .body .tt{font-weight:600;font-size:15px}
  .tl-card .body .ds{color:var(--txt-3);font-size:12.5px;margin-top:3px}
  .gen-box{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .gen-box .gt{font-family:'Poppins';font-weight:600;font-size:15px}
  .gen-box .gd{color:var(--txt-3);font-size:12.5px;margin-top:3px}
  .gen-box input[type=date]{background:var(--panel-2);border:1px solid var(--line);color:var(--txt);padding:9px 12px;border-radius:10px;font-family:inherit;font-size:13px;color-scheme:dark}
  .gen-box .mf{display:flex;flex-direction:column;gap:5px}
  .gen-box .mf label{font-size:11px;font-weight:600;color:var(--txt-3);text-transform:uppercase;letter-spacing:.06em}
  .gen-box .mf input{background:var(--panel-2);border:1px solid var(--line);color:var(--txt);padding:9px 12px;border-radius:10px;font-family:inherit;font-size:13px;outline:none;color-scheme:dark}
  .gen-box .mf input:focus{border-color:var(--accent)}
  .sched-type{display:flex;gap:6px}
  .tag.kind-deadline{background:rgba(224,50,42,.15);color:#e0322a}
  .tag.kind-goal{background:rgba(78,168,232,.16);color:var(--blue)}
  .tl-card{position:relative}
  .sch-del{position:absolute;top:10px;right:10px;background:transparent;border:none;color:var(--txt-3);cursor:pointer;padding:5px;border-radius:6px;opacity:0;transition:.12s;display:grid;place-items:center}
  .sch-del svg{width:14px;height:14px}
  .tl-card:hover .sch-del{opacity:1}
  .sch-del:hover{color:#e0322a;background:var(--hover)}

  /* exp gallery */
  .exp-gallery{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin-top:8px}
  .exp-tile{border-radius:var(--r-md);overflow:hidden;background:var(--panel-2);border:1.5px dashed var(--line);aspect-ratio:1;cursor:pointer;display:grid;place-items:center;position:relative;transition:.16s}
  .exp-tile:hover{border-color:var(--accent);background:#191316}
  .exp-tile.is-cover{border-style:solid;border-color:var(--accent);background:#20140f}
  .exp-tile img{width:100%;height:100%;object-fit:cover}
  .exp-tile .m-drop{display:flex;flex-direction:column;align-items:center;gap:9px;color:var(--txt-3);text-align:center;padding:16px}
  .exp-tile .m-drop svg{width:28px;height:28px}
  .exp-tile .m-drop .lbl{font-weight:600;color:var(--txt-2);font-size:13px}
  .exp-tile .m-drop .sm{font-size:11px}
  .exp-tile .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 11px;font-weight:600;font-size:13px;background:linear-gradient(transparent,rgba(0,0,0,.82))}
  /* artwork working set + pool */
  .art-section{margin-top:22px}
  .art-sec-head{display:flex;align-items:center;gap:10px;font-family:'Poppins';font-weight:600;font-size:16px;margin-bottom:12px}
  .art-sec-head .art-cnt{font-family:'JetBrains Mono';font-size:12px;color:var(--txt-3);background:var(--card);border:1px solid var(--line);padding:1px 8px;border-radius:20px}
  .art-sec-head .art-sub{color:var(--txt-3);font-size:12.5px;font-weight:400}
  .art-drop{min-height:130px;border:1.5px dashed transparent;border-radius:var(--r-md);transition:.15s;padding:2px}
  .art-drop.dragover{border-color:var(--accent);background:rgba(255,77,28,.05)}
  .art-empty{grid-column:1/-1;color:var(--txt-3);font-size:12.5px;font-style:italic;padding:34px 16px;text-align:center;border:1.5px dashed var(--line-soft);border-radius:var(--r-md)}
  .exp-tile[draggable=true]{cursor:grab}
  .art-large{width:100%;max-height:54vh;border-radius:var(--r-md);overflow:hidden;background:var(--card-hi);display:grid;place-items:center}
  .art-large img{width:100%;max-height:54vh;object-fit:contain;display:block}
  .art-large-ph{padding:60px;color:var(--txt-3)}
  .mf-lbl{font-size:11px;font-weight:600;color:var(--txt-3);text-transform:uppercase;letter-spacing:.06em}
  .art-pills{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .art-custom{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:9px 11px;font-size:13px;outline:none;margin-top:4px;font-family:inherit}
  .art-custom:focus{border-color:var(--accent)}
  .art-modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  /* settings */
  .set-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px;align-items:start}
  @media(max-width:820px){.set-grid{grid-template-columns:1fr}}
  .set-grid .mf{display:flex;flex-direction:column;gap:5px}
  .set-grid .mf label{font-size:11px;font-weight:600;color:var(--txt-3);text-transform:uppercase;letter-spacing:.06em}
  .set-grid .mf input{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:9px 11px;font-family:inherit;font-size:13px;outline:none}
  .set-grid .mf input:focus{border-color:var(--accent)}
  .plan-badge{display:inline-block;background:var(--accent-dim);color:var(--accent-hi);border:1px solid rgba(255,77,28,.3);padding:6px 13px;border-radius:20px;font-size:13px;font-weight:600}
  .slot-flash{animation:slotFlash 1.6s ease-out}
  .merch-flash{animation:slotFlash 1.6s ease-out;border-radius:var(--r-lg)}
  @keyframes slotFlash{0%,100%{box-shadow:0 0 0 0 rgba(255,77,28,0)}20%{box-shadow:0 0 0 3px var(--accent),0 0 22px rgba(255,77,28,.6)}}

  /* merch items (full records — v2) */
  .merch-thumb{width:200px;height:200px;border-radius:16px;flex:none;background:var(--card-hi);overflow:hidden;display:grid;place-items:center;color:var(--txt-3);border:1px solid var(--line-soft)}
  .merch-thumb img{width:100%;height:100%;object-fit:cover}
  .merch-thumb svg{width:60px;height:60px}
  /* larger collapsed merch rows (200px artwork) */
  .idea-song[data-mi] .idea-head{padding:20px 22px;gap:22px}
  .idea-song[data-mi] .idea-title{font-size:28px;font-family:'Poppins';letter-spacing:-.01em}
  .idea-song[data-mi] .merch-sub{font-size:15px;gap:12px;margin-top:10px}
  .idea-song[data-mi] .merch-sub .swatch{width:16px;height:16px}
  .size-qty-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .sq{display:flex;flex-direction:column;gap:4px;width:74px}
  .sq-tog{padding:6px 0;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--txt-2);font-weight:600;font-size:12px;cursor:pointer;font-family:inherit}
  .sq.on .sq-tog{background:var(--accent-dim);border-color:rgba(255,77,28,.4);color:var(--accent-hi)}
  .sq-in{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:6px;font-size:12px;text-align:center;outline:none;font-family:'JetBrains Mono'}
  .sq-in:focus{border-color:var(--accent)}
  /* custom number steppers (hide native spinners) */
  input.no-spin::-webkit-outer-spin-button,input.no-spin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input.no-spin{-moz-appearance:textfield}
  .num-stepper{display:flex;align-items:stretch}
  .num-stepper .sq-in,.num-stepper .mf-total{border-top-right-radius:0;border-bottom-right-radius:0;border-right:none;flex:1;min-width:0}
  .ns-col{display:flex;flex-direction:column;border:1px solid var(--line);border-left:none;border-radius:0 8px 8px 0;overflow:hidden;flex:none;width:22px}
  .ns-col button{flex:1;background:var(--card);border:none;color:var(--txt-2);cursor:pointer;display:grid;place-items:center;padding:0}
  .ns-col button:hover{background:var(--hover);color:var(--txt)}
  .ns-col .ns-up{border-bottom:1px solid var(--line)}
  .ns-col button svg{width:11px;height:11px}
  .sq-total{font-size:12.5px;color:var(--txt-3);margin-top:10px}
  .sq-total b{color:var(--txt);font-family:'JetBrains Mono'}
  .mf-total{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:9px 11px;font-size:13px;outline:none;margin-top:6px;max-width:200px;font-family:inherit}
  .mf-total:focus{border-color:var(--accent)}
  .merch-sub{color:var(--txt-3);font-size:11.5px;margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .merch-sub .msep{width:3px;height:3px;border-radius:50%;background:var(--txt-3);flex:none}
  .merch-sub .swatch{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);flex:none;display:inline-block;vertical-align:-2px;margin-right:5px}
  .merch-budget{font-family:'JetBrains Mono';color:var(--accent-hi)}
  .merch-imgs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .merch-slot{border-radius:var(--r-md);overflow:hidden;aspect-ratio:4/3;background:var(--panel-2);border:1.5px dashed var(--line);cursor:pointer;display:grid;place-items:center;position:relative;transition:.16s}
  .merch-slot:hover{border-color:var(--accent);background:#191316}
  .merch-slot img{width:100%;height:100%;object-fit:cover}
  .merch-slot .ms-drop{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--txt-3);text-align:center;padding:14px}
  .merch-slot .ms-drop svg{width:24px;height:24px}
  .merch-slot .ms-lbl{font-size:12px;font-weight:600;color:var(--txt-2)}
  .merch-slot .ms-cap{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 8px;font-size:11px;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.8))}
  .merch-slot.uploading{cursor:default;border-style:solid}
  /* non-previewable file card (PSD/AI/…) — Google-Drive style */
  .file-card{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:14px;text-align:center;background:var(--panel-2)}
  .file-card .fc-ic{position:relative;color:var(--txt-3)}
  .file-card .fc-ic svg{width:40px;height:40px}
  .file-card .fc-ext{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);font-size:8.5px;font-weight:800;letter-spacing:.03em;color:#fff;background:var(--accent);padding:1px 4px;border-radius:3px;line-height:1.3}
  .file-card .fc-name{font-size:11px;font-weight:600;color:var(--txt-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;word-break:break-all}
  .art-large .file-card{aspect-ratio:1;min-height:220px}
  /* upload progress overlay (merch slot + media tile) */
  .ms-up{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
  .ms-upbar{height:5px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
  .ms-upbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .15s ease}
  .ms-uppct{margin-top:5px;font-size:10.5px;font-weight:700;color:#fff;letter-spacing:.02em}
  /* download button on a filled slot/tile */
  .ms-dl{position:absolute;top:7px;right:7px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.16);color:#fff;cursor:pointer;opacity:0;transition:.15s;z-index:3}
  .ms-dl svg{width:15px;height:15px}
  .ms-dl:hover{background:var(--accent);border-color:var(--accent)}
  .merch-slot:hover .ms-dl,.exp-tile:hover .ms-dl{opacity:1}
  @media(max-width:1024px){.ms-dl{opacity:1;background:rgba(0,0,0,.62)}}
  .merch-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  @media(max-width:700px){.merch-fields{grid-template-columns:1fr}}
  .mf{display:flex;flex-direction:column;gap:5px}
  .mf label{font-size:11px;font-weight:600;color:var(--txt-3);text-transform:uppercase;letter-spacing:.06em}
  .mf input{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:9px 11px;font-family:inherit;font-size:13px;outline:none}
  .mf input:focus{border-color:var(--accent)}
  .mf.full{grid-column:1/-1}
  .size-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
  .size-chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel-2);color:var(--txt-2);font-weight:600;font-size:12px;cursor:pointer;transition:.12s;font-family:inherit}
  .size-chip:hover{border-color:var(--txt-2)}
  .size-chip.on{background:var(--accent-dim);border-color:rgba(255,77,28,.4);color:var(--accent-hi)}
  .mini-toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--txt-2);user-select:none;text-transform:none;letter-spacing:0;font-weight:500}
  .mini-toggle .tg{width:34px;height:19px;border-radius:20px;background:var(--grey);position:relative;transition:.15s;flex:none}
  .mini-toggle .tg::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.15s}
  .mini-toggle.on .tg{background:var(--accent)}
  .mini-toggle.on .tg::after{left:17px}

  /* song detail */
  /* per-song single artwork (in the song header, between number and title) */
  .song-art{flex:none;border-radius:var(--r-sm);overflow:hidden;background:var(--card-hi);border:1.5px dashed var(--line);cursor:pointer;display:grid;place-items:center;position:relative;transition:.16s}
  .song-art.sm{width:50px;height:50px;border-radius:10px}
  .song-art:hover{border-color:var(--accent);background:#191316}
  .song-art.filled{border-style:solid;border-color:var(--line-soft)}
  .song-art img{width:100%;height:100%;object-fit:cover}
  .song-art .sa-drop{display:grid;place-items:center;color:var(--txt-3)}
  .song-art .sa-drop svg{width:18px;height:18px}
  .song-art .sa-replace{position:absolute;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;color:#fff;opacity:0;transition:.16s}
  .song-art:hover .sa-replace{opacity:1}
  .song-art .sa-replace svg{width:16px;height:16px}
  .exp-tile .song-badge{position:absolute;top:8px;left:8px;z-index:3;background:var(--blue);color:#04263b;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:6px}
  /* finalized markers */
  .final-badge{position:absolute;top:8px;right:8px;z-index:3;width:24px;height:24px;border-radius:50%;background:var(--green);color:#04371f;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .final-badge svg{width:14px;height:14px}
  .exp-tile.is-final{outline:2px solid var(--green);outline-offset:-2px}
  .merch-thumb{position:relative}
  .merch-thumb .final-badge{width:26px;height:26px}
  .ico-btn.is-final-btn{background:var(--green);color:#04371f}
  .ghost-btn.is-final-btn{border-color:var(--green);color:var(--green)}
  .song-zones{display:flex;flex-direction:column;gap:16px;margin-top:14px}
  .song-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-width:0}
  .song-cols.three{grid-template-columns:1fr 1fr 1fr}
  .song-cols>*{min-width:0}
  @media(max-width:900px){.song-cols,.song-cols.three{grid-template-columns:1fr}}
  /* min-width:0 lets grid/flex tracks shrink so long unbroken URLs ellipsize instead of forcing overflow */
  .zone{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:var(--r-md);overflow:visible;display:flex;flex-direction:column;min-width:0}
  .zone-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-soft);background:rgba(255,255,255,.015)}
  .zh-ic{width:26px;height:26px;border-radius:7px;flex:none;background:var(--accent-dim);color:var(--accent-hi);display:grid;place-items:center}
  .zh-ic svg{width:15px;height:15px}
  .zh-t{font-family:'Poppins';font-weight:600;font-size:13.5px;flex:1}
  .zh-c{font-family:'JetBrains Mono';font-size:12px;color:var(--txt-3);background:var(--card);border:1px solid var(--line);padding:1px 8px;border-radius:20px}
  .zone-body{padding:14px 16px}
  .zone-body .tracks{margin:0}
  .dropzone.slim{padding:16px;margin:12px 0 0}
  .lyrics-area{min-height:180px}
  .song-detail-grid{display:grid;grid-template-columns:1fr 320px;gap:18px;margin-top:20px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-lg);overflow:hidden}
  .panel-head{padding:16px 20px 12px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line-soft)}
  .panel-head .ic{width:28px;height:28px;border-radius:8px;background:var(--accent-dim);color:var(--accent-hi);display:grid;place-items:center;flex:none}
  .panel-head .ic svg{width:16px;height:16px}
  .panel-head h4{font-family:'Poppins';font-weight:600;font-size:15px}
  .panel-body{padding:16px 20px}
  .set-note{color:var(--txt-3);font-size:12.5px;line-height:1.55;margin-bottom:14px}
  .dial-album{padding:12px 0;border-top:1px solid var(--line-soft)}
  .dial-album:first-of-type{border-top:none;padding-top:2px}
  .dial-album-name{font-weight:600;font-size:13.5px;margin-bottom:9px}
  .dial-artist{color:var(--txt-3);font-weight:500;font-size:12px}
  .arch-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line-soft)}
  .arch-row:first-of-type{border-top:none}
  .arch-info{flex:1;min-width:0}
  .arch-title{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .arch-artist{color:var(--txt-3);font-size:12px;margin-top:1px}
  .arch-row .ghost-btn{padding:7px 12px;font-size:12.5px;flex:none}
  .ghost-btn.danger-btn{color:#e0322a;border-color:rgba(224,50,42,.5)}
  .ghost-btn.danger-btn:hover{background:rgba(224,50,42,.12)}
  .lyrics-area{width:100%;min-height:220px;background:transparent;border:none;color:var(--txt);font-family:'Inter';font-size:14px;line-height:1.7;resize:vertical;outline:none}
  .lyrics-area::placeholder{color:var(--txt-3)}
  .notes-area{width:100%;min-height:90px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-family:inherit;font-size:13px;line-height:1.5;padding:10px 12px;resize:vertical;outline:none}
  .ref-row,.credit-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:13px}
  .ref-row:first-child,.credit-row:first-child{border-top:none}
  .ref-row .ri{width:26px;height:26px;border-radius:6px;background:var(--panel-2);display:grid;place-items:center;color:var(--txt-3);flex:none}
  .ref-row .ri svg{width:14px;height:14px}
  .ref-row .ri.ri-artist{color:var(--blue)}
  .ref-row .ri.ri-song{color:var(--accent-hi)}
  .ref-row .ri.ri-genre{color:var(--green)}
  .ref-row .ri.ri-link{color:#B06BFF}
  .ref-row .ri.ri-file{color:var(--amber)}
  .ref-sub{color:var(--txt-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ref-row a.ico-btn{text-decoration:none}
  .ref-menu{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .ref-menu button{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel-2);color:var(--txt-2);font-weight:600;font-size:11.5px;cursor:pointer;font-family:inherit}
  .ref-menu button:hover{border-color:var(--accent);color:var(--txt)}
  .ref-menu button svg{width:12px;height:12px}
  .credit-row .who{font-weight:600;flex:1}
  .credit-row .role{color:var(--txt-3);font-size:12px}
  .credit-row .split{font-family:'JetBrains Mono';font-size:12.5px;color:var(--accent-hi);font-weight:600}
  .cmt-row{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line-soft)}
  .cmt-row:first-child{border-top:none}
  .cmt-av{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff}
  .cmt-body .cmeta{display:flex;align-items:center;gap:8px;margin-bottom:3px}
  .cmt-body .cwho{font-weight:600;font-size:12.5px}
  .cmt-body .cstamp{font-family:'JetBrains Mono';font-size:11px;color:var(--accent-hi);background:var(--accent-dim);padding:1px 6px;border-radius:5px}
  .cmt-body .cdate{font-family:'JetBrains Mono';font-size:10.5px;color:var(--txt-3)}
  .cmt-body .ctext{font-size:13px;color:var(--txt-2);line-height:1.4}
  .cmt-acts{margin-left:auto;display:inline-flex;gap:2px;opacity:0;transition:.12s}
  .cmt-row:hover .cmt-acts{opacity:1}
  .cmt-acts button{background:transparent;border:none;color:var(--txt-3);cursor:pointer;padding:3px;border-radius:5px;display:grid;place-items:center}
  .cmt-acts button svg{width:13px;height:13px}
  .cmt-acts button:hover{color:var(--accent-hi);background:var(--hover)}
  .cmt-acts button:last-child:hover{color:#e0322a}

  /* share modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:100;display:none;place-items:center;padding:24px}
  .modal-bg.show{display:grid}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);max-width:520px;width:100%;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .modal-head{padding:20px 24px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between}
  .modal-head h3{font-family:'Poppins';font-weight:700;font-size:18px}
  .modal-body{padding:22px 24px}
  .share-card{background:linear-gradient(150deg,#20140f,#141417);border:1px solid var(--line);border-radius:var(--r-md);padding:22px;text-align:center}
  .share-card .sc-band{font-family:'Poppins';font-weight:700;font-size:20px}
  .share-card .sc-album{color:var(--txt-2);font-size:13px;margin-top:2px}
  .share-card .sc-cover{width:210px;height:210px;border-radius:18px;overflow:hidden;margin:18px auto 6px;background:var(--card-hi);box-shadow:0 14px 34px rgba(0,0,0,.55);display:grid;place-items:center}
  .share-card .sc-cover img{width:100%;height:100%;object-fit:cover}
  .share-card .sc-cover-ph{font-family:'Poppins';font-weight:800;font-size:70px;color:var(--txt-3)}
  .share-card .sc-ringwrap{position:relative;width:110px;height:110px;margin:14px auto 8px}
  .share-card .sc-ringwrap svg{position:absolute;inset:0}
  .share-card .sc-ring-pct{position:absolute;inset:0;display:grid;place-items:center;font-family:'Poppins';font-weight:800;font-size:26px;color:var(--accent-hi)}
  .share-card .sc-l{color:var(--txt-3);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
  .share-link{display:flex;gap:8px;margin-top:18px}
  .share-link input{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--txt-2);font-family:'JetBrains Mono';font-size:12px;outline:none}

  ::-webkit-scrollbar{width:12px;height:12px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#2c2c33;border-radius:8px;border:3px solid transparent;background-clip:padding-box}
  .hidden{display:none!important}

  /* ===== call bar ===== */
  .callbar{position:fixed;left:278px;right:16px;bottom:16px;z-index:60;background:var(--card-hi);border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:var(--r-lg);box-shadow:0 18px 55px rgba(0,0,0,.6);overflow:hidden}
  .call-collapsed{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;gap:16px}
  .cc-left{display:flex;align-items:center;gap:12px;min-width:0}
  .cc-ic{width:38px;height:38px;border-radius:11px;flex:none;background:var(--accent);color:#fff;display:grid;place-items:center}
  .cc-ic svg{width:19px;height:19px}
  .cc-t{font-weight:700;font-size:14px;font-family:'Poppins'}
  .cc-s{color:var(--txt-3);font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cc-right{display:flex;align-items:center;gap:16px;flex:none}
  .cc-right .member-stack .avatar{width:32px;height:32px;border-width:2.5px;border-color:var(--card-hi)}
  .call-start{background:var(--accent);border:none;color:#fff;font-weight:600;font-size:13px;font-family:inherit;padding:9px 16px;border-radius:22px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.14s}
  .call-start:hover{background:var(--accent-hi)}
  .call-start svg{width:15px;height:15px}
  .call-open{display:none;padding:14px 18px 16px}
  .callbar.open .call-collapsed{display:none}
  .callbar.open .call-open{display:block}
  .call-open-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .coh-left{display:flex;align-items:center;gap:10px;font-size:13.5px}
  .live-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(255,77,28,.5);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,28,.5)}70%{box-shadow:0 0 0 8px rgba(255,77,28,0)}100%{box-shadow:0 0 0 0 rgba(255,77,28,0)}}
  .coh-ctx{color:var(--txt-3);font-size:12px;background:var(--panel-2);border:1px solid var(--line-soft);padding:3px 10px;border-radius:20px;margin-left:6px}
  .video-tiles{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .vtile{width:132px;aspect-ratio:4/3;border-radius:var(--r-sm);background:linear-gradient(160deg,#1c1c21,#141417);border:1px solid var(--line-soft);position:relative;display:grid;place-items:center;overflow:hidden;flex:none}
  .vtile.you{border-color:rgba(255,77,28,.45)}
  .vtile .vav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff}
  .vtile .vname{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:600;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:5px}
  .vtile .vmic{position:absolute;right:6px;bottom:6px;width:19px;height:19px;border-radius:5px;background:rgba(0,0,0,.55);display:grid;place-items:center;color:#fff}
