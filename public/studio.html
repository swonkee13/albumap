function addTag(kind,val){const al=AL();ensureTags(al);val=(val||'').trim();if(!val)return;const arr=tagArr(al,kind);if(arr.some(x=>x.toLowerCase()===val.toLowerCase()))return;arr.push(val);persistTags(al,kind);renderTagManager();refreshPalettes();}
function deleteTag(kind,idx){const al=AL();ensureTags(al);const arr=tagArr(al,kind);if(idx<0||idx>=arr.length)return;arr.splice(idx,1);persistTags(al,kind);renderTagManager();refreshPalettes();}
function renameTag(kind,idx){
  const al=AL();ensureTags(al);const arr=tagArr(al,kind);const old=arr[idx];if(old==null)return;
  const name=(prompt('Rename tag',old)||'').trim();if(!name||name===old)return;
  if(arr.some((x,i)=>i!==idx&&x.toLowerCase()===name.toLowerCase())){alert('That tag already exists.');return;}
  arr[idx]=name;persistTags(al,kind);
  // migrate existing file labels old → new (local + persist affected files)
  const files=[];al.songs.forEach(s=>(s.files||[]).forEach(f=>files.push(f)));(al.bank||[]).forEach(f=>files.push(f));
  files.forEach(f=>{if(f.labels&&f.labels.includes(old)){f.labels=f.labels.map(l=>l===old?name:l);if(f.sid)fetch('/api/song-file',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:f.sid,labels:f.labels})}).catch(()=>{});}});
  renderTagManager();refreshPalettes();
}

function stableWave(seed,n){n=n||120;let h=[],s=0;for(let i=0;i<seed.length;i++)s+=seed.charCodeAt(i);let prev=0.4;for(let i=0;i<n;i++){s=(s*9301+49297)%233280;const r=s/233280;const env=Math.pow(Math.sin((i/n)*Math.PI),0.6);const target=(0.12+r*0.88)*(0.35+0.65*env);prev=prev*0.55+target*0.45;h.push(Math.max(.08,Math.min(1,prev)));}return h;}
/* decode real audio into a peak waveform */
async function decodeWaveform(url,n){
  n=n||120;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const buf=await fetch(url).then(r=>r.arrayBuffer());
    const audio=await ctx.decodeAudioData(buf);
    const data=audio.getChannelData(0);
    const block=Math.floor(data.length/n);
    let peaks=[];let max=0;
    for(let i=0;i<n;i++){let p=0;for(let j=0;j<block;j++){const v=Math.abs(data[i*block+j]||0);if(v>p)p=v;}peaks.push(p);if(p>max)max=p;}
    ctx.close();
    return peaks.map(p=>Math.max(.06,max?p/max:0));
  }catch(e){return stableWave(url,n);}
}

function handleAudio(files,target){
  const al=AL();const audio=files.filter(f=>/audio|\.wav|\.mp3|\.m4a|\.aiff/i.test(f.type+f.name));
  if(!audio.length){if(files.length)alert('Drop a WAV, MP3, M4A or AIFF.');return;}
  const isBank=(target==='bank');
  const song=isBank?null:al.songs[target];
  if(!isBank&&!song)return;
  audio.forEach(f=>{const fmt=/wav/i.test(f.name)?'wav':/mp3|mpeg/i.test(f.name)?'mp3':/m4a|aiff/i.test(f.name)?'m4a':'mp3';
    const url=URL.createObjectURL(f);const t={id:++uidc,name:f.name,fmt,note:'uploading…',url,dur:null,labels:[],waveform:stableWave(f.name+f.size,160)};
    if(isBank){al.bank=al.bank||[];al.bank.push(t);}else{song.files.push(t);}
    renderSongsAudio();
    const probe=new Audio();probe.src=url;probe.addEventListener('loadedmetadata',()=>{t.dur=probe.duration;renderSongsAudio();});
    decodeWaveform(url,160).then(w=>{t.waveform=w;renderSongsAudio();});
    uploadToR2(f,isBank?{albumId:al.id,bank:true}:{songId:song.id},t);});
}
async function uploadToR2(f,dest,t){
  try{
    const b1=dest.songId?{songId:dest.songId,name:f.name}:{albumId:dest.albumId,bank:true,name:f.name};
    const up=await fetch('/api/upload-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b1)}).then(r=>r.json());
    if(!up.ok)throw new Error('url');
    const put=await fetch(up.uploadUrl,{method:'PUT',headers:{'Content-Type':up.contentType},body:f});
    if(!put.ok)throw new Error('put');
    const b2=dest.songId?{songId:dest.songId,name:f.name,key:up.key,size:f.size,duration:t.dur}:{albumId:dest.albumId,bank:true,name:f.name,key:up.key,size:f.size,duration:t.dur};
    const meta=await fetch('/api/song-file',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b2)}).then(r=>r.json());
    if(!meta.ok)throw new Error('save');
    t.sid=meta.id;t.note='saved';
    if(t.labels&&t.labels.length)fetch('/api/song-file',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:t.sid,labels:t.labels})}).catch(()=>{});
    if(t.master)fetch('/api/song-file',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:t.sid,master:true})}).catch(()=>{});
    renderSongsAudio();
  }catch(e){t.note='upload failed — check R2 setup';renderSongsAudio();}
}

let curAudio=null,curTid=null;
function findFile(id){const al=AL();if(!al)return null;for(const s of al.songs){const t=s.files.find(x=>x.id===id);if(t)return t;}for(const t of (al.bank||[])){if(t.id===id)return t;}return null;}
function togglePlay(id){
  const t=findFile(id);
  if(!t||!t.url){alert('This is a seeded demo row with no real file. Drop a real WAV or MP3 to hear playback.');return;}
  // Same track already loaded → pause/resume in place (keeps the seek position).
  if(curTid===id&&curAudio){
    if(curAudio.paused){curAudio.play().catch(()=>{});setPlayUI(id);}
    else{curAudio.pause();setPlayUI(null);}
    return;
  }
  if(curAudio)curAudio.pause();
  curAudio=new Audio(t.url);curTid=id;
  curAudio.addEventListener('timeupdate',()=>updProg(id));
  curAudio.addEventListener('ended',()=>{setPlayUI(null);resetWaveUI(id);t.seekFrac=0;});
  // Start from a click-seeked point chosen while paused, if any.
  const startFrac=t.seekFrac||0;
  const applySeek=()=>{if(startFrac)try{curAudio.currentTime=startFrac*(curAudio.duration||t.dur||0);}catch(e){}};
  if(curAudio.readyState>=1)applySeek();
  curAudio.addEventListener('loadedmetadata',applySeek,{once:true});
  curAudio.play().catch(()=>{});
  setPlayUI(id);
}
function setPlayUI(id){document.querySelectorAll('.track').forEach(el=>el.classList.toggle('playing',+el.dataset.tid===id));}
function fillWaveTo(id,frac){const w=document.querySelector(`.wave[data-tid="${id}"]`);if(!w)return;const bars=w.querySelectorAll('.bar');const lit=Math.round(Math.max(0,Math.min(1,frac))*bars.length);bars.forEach((b,i)=>b.classList.toggle('on',i<lit));}
function updProg(id){if(!curAudio)return;const pct=curAudio.currentTime/(curAudio.duration||1);fillWaveTo(id,pct);const cur=document.querySelector(`[data-cur="${id}"]`);if(cur)cur.textContent=fmtT(curAudio.currentTime);
  // Auto-reveal a comment's popup for a couple seconds as the playhead passes it.
  const w=document.querySelector(`.wave[data-tid="${id}"]`);
  if(w){const t=curAudio.currentTime;const last=(w._lastT==null)?t:w._lastT;w._lastT=t;
    if(t>=last)w.querySelectorAll('.wave-mark').forEach(m=>{const sec=+m.dataset.sec;if(sec>last&&sec<=t){m.classList.add('wm-show');clearTimeout(m._ht);m._ht=setTimeout(()=>m.classList.remove('wm-show'),2400);}});}
}

/* Precise seek anywhere on the waveform — playing or paused, backward or forward.
   Proportion is measured from the waveform container's bounding rect. */
let waveDragId=null;
function fracFromEvent(e,id){const w=document.querySelector(`.wave[data-tid="${id}"]`);if(!w)return 0;const r=w.getBoundingClientRect();return (e.clientX-r.left)/r.width;}
function seekAt(id,frac){
  const t=findFile(id);if(!t)return;
  frac=Math.max(0,Math.min(1,frac));
  if(curTid===id&&curAudio){curAudio.currentTime=frac*(curAudio.duration||t.dur||0);updProg(id);}
  else{t.seekFrac=frac;fillWaveTo(id,frac);const cur=document.querySelector(`[data-cur="${id}"]`);if(cur&&t.dur)cur.textContent=fmtT(frac*t.dur);}
}

let seqSongs=[];
function pickPlayFile(s){const files=s.files||[];const m=files.find(x=>x.master&&x.url);if(m)return m;const withUrl=files.filter(x=>x.url);return withUrl.length?withUrl[withUrl.length-1]:null;}
function seqLayoutKey(albumId){return 'albumap:seq:'+albumId;}

function saveSeqLayout(){const al=AL();if(!al)return;try{localStorage.setItem(seqLayoutKey(al.id),JSON.stringify(seqSongs.map(s=>s.placeholder?{ph:true,id:s.id,name:s.name,color:s.color,dur:s.dur}:{id:s.id})));}catch(e){}}
function seqPersist(){persistSeqOrder();saveSeqLayout();}
function buildSeqSongs(al){
  const base=al.songs.map((s,i)=>{const f=pickPlayFile(s);return {id:s.id,name:s.t,dur:(f&&f.dur)||s.dur||210,color:SONG_COLORS[i%SONG_COLORS.length],url:f?f.url:null};});
  const layout=loadSeqLayout(al.id);
  if(!layout||!layout.length)return base;
  const byId={};base.forEach(b=>byId[b.id]=b);const out=[],used=new Set();
  layout.forEach(tok=>{
    if(tok&&tok.ph)out.push({id:tok.id,name:tok.name||'Placeholder',dur:tok.dur||PH_DUR,color:tok.color||PH_COLORS[0],url:null,placeholder:true});
    else if(tok&&byId[tok.id]&&!used.has(tok.id)){out.push(byId[tok.id]);used.add(tok.id);}
  });
  base.forEach(b=>{if(!used.has(b.id)){out.push(b);used.add(b.id);}});
  return out;
}

}
function removePlaceholder(id){seqSongs=seqSongs.filter(s=>s.id!==id);seqStop();seqPos=0;renderSeq();seqPersist();}

function seqTotal(){return seqSongs.reduce((a,s)=>a+s.dur,0);}
function shade(hex,pct){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=Math.max(0,Math.min(255,r+pct));g=Math.max(0,Math.min(255,g+pct));b=Math.max(0,Math.min(255,b+pct));return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function renderSeq(){
  const tl=document.getElementById('seqTimeline'),ph=document.getElementById('seqPlayhead'),total=seqTotal();
  const ruler=document.getElementById('seqRuler');ruler.innerHTML='';for(let i=0;i<8;i++){const d=document.createElement('div');d.className='tick';d.textContent=fmtT(total*i/8);ruler.appendChild(d);}
  [...tl.querySelectorAll('.block')].forEach(b=>b.remove());
  seqSongs.forEach((s,idx)=>{const b=document.createElement('div');b.className='block'+(s.placeholder?' placeholder':(s.url?'':' no-audio'));b.dataset.id=s.id;b.style.transition='none';
    if(s.placeholder){b.style.background=s.color+'26';b.style.boxShadow='inset 0 0 0 1.5px '+s.color+'aa';
      b.innerHTML=`<button class="ph-x" title="Remove placeholder" onpointerdown="event.stopPropagation()" onclick="removePlaceholder('${s.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg></button><div class="b-top"><span class="b-num">${String(idx+1).padStart(2,'0')}</span><span class="b-dur">${fmtT(s.dur)}</span></div><div class="ph-label"><svg viewBox="0 0 24 24" fill="currentColor" style="width:12px;height:12px"><path d="M12 3 2 12l10 9 10-9z"/></svg>PLACEHOLDER</div>`;
    }else{b.style.background=`linear-gradient(160deg,${s.color},${shade(s.color,-18)})`;const wave=stableWave(s.name,Math.max(24,Math.round(s.dur/3)));
      b.innerHTML=`<div class="b-top"><span class="b-num">${String(idx+1).padStart(2,'0')}</span><span class="b-dur">${fmtT(s.dur)}</span></div><div class="b-name">${esc(s.name)}</div>${s.url?'':'<span class="no-audio-tag">no audio</span>'}<div class="b-wave">${wave.map(h=>`<div class="wb" style="height:${Math.round(h*100)}%"></div>`).join('')}</div>`;}
    b.addEventListener('pointerdown',e=>blockPointerDown(e,s.id));tl.insertBefore(b,ph);});
  layoutBlocks();
  // enable the sliding transition only after the initial positions are set
  requestAnimationFrame(()=>{tl.querySelectorAll('.block').forEach(b=>{if(!b.classList.contains('seq-lift'))b.style.transition='';});});
  updateSeqStats();renderSeqOrder();
}
function layoutBlocks(exceptId){
  const total=seqTotal();let acc=0;
  seqSongs.forEach((s,idx)=>{const leftPct=total?(acc/total*100):0;const widthPct=total?(s.dur/total*100):0;acc+=s.dur;const el=blockEl(s.id);if(!el)return;
    el.style.width='calc('+widthPct.toFixed(4)+'% - 3px)';
    if(s.id!==exceptId)el.style.left='calc('+leftPct.toFixed(4)+'% + 2px)';
    const num=el.querySelector('.b-num');if(num)num.textContent=String(idx+1).padStart(2,'0');});
}
function updateSeqStats(){const total=seqTotal();const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};set('seqCount',seqSongs.length);set('seqLen',fmtT(total));set('seqTot',fmtT(total));set('seqSides',seqSides());}
function renderSeqOrder(){const total=seqTotal();const host=document.getElementById('seqOrder');if(!host)return;
  host.innerHTML=`<div class="ol-head">Album order · ${seqSongs.length} tracks · ${fmtT(total)} · drag ≡ to reorder</div>`+seqSongs.map((s,i)=>{const grip=`<span class="ol-grip" onpointerdown="rowPointerDown(event,'${s.id}')" title="Drag to reorder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h16M4 16h16"/></svg></span><span class="ol-num">${String(i+1).padStart(2,'0')}</span><span class="ol-sw" style="background:${s.color}"></span>`;
    if(s.placeholder)return `<div class="ol-row placeholder" data-id="${s.id}">${grip}<span class="ol-name" style="color:var(--txt-3)">◇ Placeholder</span><span class="ol-dur">${fmtT(s.dur)}</span><button class="ph-x sm" title="Remove" onpointerdown="event.stopPropagation()" onclick="removePlaceholder('${s.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>`;
    return `<div class="ol-row${s.url?'':' no-audio'}" data-id="${s.id}">${grip}<span class="ol-name" style="cursor:pointer" title="Open song" onclick="nav({view:'songs',artistId:'${route.artistId}',albumId:'${route.albumId}',songId:'${s.id}'})">${esc(s.name)}</span>${s.url?'':'<span class="ol-noaudio">no audio</span>'}<span class="ol-dur">${fmtT(s.dur)}</span></div>`;
  }).join('');
}
function seqSides(){const total=seqTotal();let acc=0,split=0,best=1e9;for(let i=0;i<seqSongs.length;i++){acc+=seqSongs[i].dur;const d=Math.abs(acc-total/2);if(d<best){best=d;split=i+1;}}return`${split} / ${seqSongs.length-split}`;}
/* ===== real-audio sequencer engine ===== */
let seqPlaying=false,seqPos=0,seqIdx=0,seqAudio=null,seqRaf=null;
function seqAt(off){let acc=0;for(let i=0;i<seqSongs.length;i++){if(off<acc+seqSongs[i].dur)return{idx:i,into:off-acc};acc+=seqSongs[i].dur;}const last=Math.max(0,seqSongs.length-1);return{idx:last,into:seqSongs.length?seqSongs[last].dur:0};}
function accBefore(idx){let a=0;for(let i=0;i<idx&&i<seqSongs.length;i++)a+=seqSongs[i].dur;return a;}
function seqPlayableFrom(idx){for(let i=Math.max(0,idx);i<seqSongs.length;i++)if(seqSongs[i].url)return i;return -1;}
function seqCurGlobal(){if(!seqPlaying)return seqPos;return accBefore(seqIdx)+(seqAudio?seqAudio.currentTime:0);}
function toggleSeq(){seqPlaying?seqPause():seqPlay();}
function seqPlay(){
  if(seqPlaying||!seqSongs.length)return;
  let{idx,into}=seqAt(seqPos);
  if(!seqSongs[idx]||!seqSongs[idx].url){const n=seqPlayableFrom(idx+1);if(n<0){alert('No playable audio yet — set a master (or upload a file) on at least one song to hear the album here.');return;}idx=n;into=0;seqPos=accBefore(idx);}
  seqPlaying=true;document.body.classList.add('seqplaying');
  document.getElementById('seqPlayhead').style.display='block';
  seqStartSong(idx,into);
  seqRaf=requestAnimationFrame(seqTick);
}
function seqStartSong(idx,into){
  seqIdx=idx;const s=seqSongs[idx];if(!s||!s.url)return;
  if(!seqAudio){seqAudio=new Audio();seqAudio.addEventListener('ended',seqSongEnded);}
  if(seqAudio.src!==s.url){seqAudio.src=s.url;}
  const go=()=>{try{seqAudio.currentTime=into||0;}catch(e){}if(seqPlaying)seqAudio.play().catch(()=>{});};
  if(seqAudio.readyState>=1)go();else seqAudio.addEventListener('loadedmetadata',go,{once:true});
}
function seqSongEnded(){const n=seqPlayableFrom(seqIdx+1);if(n<0){seqPos=0;seqStop();return;}seqPos=accBefore(n);seqStartSong(n,0);}
function seqPause(){if(!seqPlaying)return;seqPos=seqCurGlobal();seqPlaying=false;document.body.classList.remove('seqplaying');if(seqRaf)cancelAnimationFrame(seqRaf);if(seqAudio)seqAudio.pause();}
function seqStop(){seqPlaying=false;document.body.classList.remove('seqplaying');if(seqRaf)cancelAnimationFrame(seqRaf);if(seqAudio)seqAudio.pause();const ph=document.getElementById('seqPlayhead');if(ph)ph.style.left='0px';const c=document.getElementById('seqCur');if(c)c.textContent=fmtT(seqPos);seqClearCurrent();}
function positionPlayhead(off,total){const tl=document.getElementById('seqTimeline');if(!tl)return;const w=tl.clientWidth;const ph=document.getElementById('seqPlayhead');if(ph)ph.style.left=((total?off/total:0)*w)+'px';}
function seqTick(){const total=seqTotal();const off=seqCurGlobal();positionPlayhead(off,total);const c=document.getElementById('seqCur');if(c)c.textContent=fmtT(off);seqUpdCurrent(off);if(seqPlaying)seqRaf=requestAnimationFrame(seqTick);}
function seqUpdCurrent(off){const{idx,into}=seqAt(off);const s=seqSongs[idx];if(!s)return;document.querySelectorAll('#seqTimeline .block').forEach((b,i)=>b.classList.toggle('current',seqPlaying&&i===idx));document.querySelectorAll('#seqOrder .ol-row').forEach((r,i)=>r.classList.toggle('current',seqPlaying&&i===idx));if(seqPlaying){document.getElementById('seqNow').innerHTML=`<span class="swatch" style="background:${s.color}"></span>${String(idx+1).padStart(2,'0')} · ${esc(s.name)}`;document.getElementById('seqSub').textContent=`${fmtT(into)} / ${fmtT(s.dur)} — playing ${s.url?'master/most-recent':'(no audio)'}`;}}
function seqClearCurrent(){document.querySelectorAll('#seqTimeline .block').forEach(b=>b.classList.remove('current'));document.querySelectorAll('#seqOrder .ol-row').forEach(r=>r.classList.remove('current'));}
function seqSeekClient(x){
  const total=seqTotal();const tl=document.getElementById('seqTimeline');if(!tl)return;const r=tl.getBoundingClientRect();
  const pct=Math.max(0,Math.min(1,(x-r.left)/r.width));seqPos=pct*total;
  let{idx,into}=seqAt(seqPos);const s=seqSongs[idx];
  if(seqPlaying){
    if(!s||!s.url){const n=seqPlayableFrom(idx);if(n<0){seqStop();}else{seqStartSong(n,0);seqPos=accBefore(n);}}
    else seqStartSong(idx,into);
  }
  document.getElementById('seqPlayhead').style.display='block';
  positionPlayhead(seqPos,total);
  document.getElementById('seqCur').textContent=fmtT(seqPos);
  const now=document.getElementById('seqNow');if(now&&s)now.innerHTML=`<span class="swatch" style="background:${s.color}"></span>${String(idx+1).padStart(2,'0')} · ${esc(s.name)}`;
  const sub=document.getElementById('seqSub');if(sub&&s)sub.textContent=seqPlaying?`playing ${esc(s.name)}`:`Scrubbed to ${esc(s.name)} · press play`;
}
function shuffleSeq(){seqStop();for(let i=seqSongs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[seqSongs[i],seqSongs[j]]=[seqSongs[j],seqSongs[i]];}seqPos=0;renderSeq();seqPersist();}
function persistSeqOrder(){const al=AL();if(!al)return;const order=seqSongs.filter(s=>!s.placeholder).map(s=>s.id);al.songs.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));fetch('/api/song-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({albumId:al.id,order})}).catch(()=>{});}
/* ---- pointer drag: timeline blocks ---- */
function blockEl(id){return document.querySelector(`#seqTimeline .block[data-id="${id}"]`);}
let blockDrag=null;
function blockPointerDown(e,id){if(e.button)return;const el=blockEl(id);if(!el)return;const r=el.getBoundingClientRect();blockDrag={id,startX:e.clientX,grabDx:e.clientX-r.left,moved:false};}
// The held block follows the cursor 1:1 (no transition); the others slide to
// their new slots via the CSS `left` transition — fluid, not snap-on-release.
function seqDraggedFollow(clientX){const el=blockEl(blockDrag.id);if(!el)return;const tr=document.getElementById('seqTimeline').getBoundingClientRect();const w=el.offsetWidth;let leftPx=clientX-tr.left-blockDrag.grabDx;leftPx=Math.max(0,Math.min(tr.width-w,leftPx));el.style.left=leftPx+'px';}
function seqReorderByCursor(){
  const el=blockEl(blockDrag.id);if(!el)return;const dr=el.getBoundingClientRect();const dc=dr.left+dr.width/2;
  // Compare the held block's center against each OTHER slot's target center
  // (computed from the running order, so transitions don't cause jitter).
  const tr=document.getElementById('seqTimeline').getBoundingClientRect();const total=seqTotal();let acc=0;const centers=[];
  seqSongs.forEach(s=>{centers.push({id:s.id,c:tr.left+((acc+s.dur/2)/total)*tr.width});acc+=s.dur;});
  const others=centers.filter(x=>x.id!==blockDrag.id);
  let insert=others.length;for(let i=0;i<others.length;i++){if(dc<others[i].c){insert=i;break;}}
  const dragged=seqSongs.find(s=>s.id===blockDrag.id);const rest=seqSongs.filter(s=>s.id!==blockDrag.id);
  const next=rest.slice();next.splice(insert,0,dragged);
  if(next.length===seqSongs.length&&next.every((s,i)=>s.id===seqSongs[i].id))return;
  seqSongs=next;layoutBlocks(blockDrag.id);updateSeqStats();renderSeqOrder();
}
document.addEventListener('pointermove',e=>{
  if(!blockDrag)return;
  if(!blockDrag.moved){if(Math.abs(e.clientX-blockDrag.startX)<5)return;blockDrag.moved=true;document.body.style.cursor='grabbing';const el=blockEl(blockDrag.id);if(el){el.classList.add('seq-lift');el.style.transform='translateY(-7px) scale(1.03)';}}
  seqDraggedFollow(e.clientX);
  seqReorderByCursor();
});
document.addEventListener('pointerup',e=>{
  if(!blockDrag)return;const bd=blockDrag;blockDrag=null;document.body.style.cursor='';
  const el=blockEl(bd.id);
  if(!bd.moved){if(el){el.classList.remove('seq-lift');el.style.transform='';}seqSeekClient(e.clientX);return;}
  if(el){el.classList.remove('seq-lift');el.style.transform='';}
  layoutBlocks();updateSeqStats();renderSeqOrder();seqStop();seqPos=0;seqPersist();
});
/* ---- pointer drag: order-list rows ---- */
let rowDrag=null;
function rowEl(id){return document.querySelector(`#seqOrder .ol-row[data-id="${id}"]`);}
function rowPointerDown(e,id){if(e.button)return;const idx=seqSongs.findIndex(s=>s.id===id);if(idx<0)return;e.preventDefault();rowDrag={id,idx,startY:e.clientY,moved:false,overIdx:idx,before:true};}
function rowAtClientY(y){const rows=[...document.querySelectorAll('#seqOrder .ol-row')];for(let i=0;i<rows.length;i++){const r=rows[i].getBoundingClientRect();if(y<r.top+r.height/2)return{overIdx:i,before:true};if(y<=r.bottom)return{overIdx:i,before:false};}return{overIdx:seqSongs.length-1,before:false};}
document.addEventListener('pointermove',e=>{
  if(!rowDrag)return;const dy=e.clientY-rowDrag.startY;
  if(!rowDrag.moved){if(Math.abs(dy)<4)return;rowDrag.moved=true;document.body.style.cursor='grabbing';const el=rowEl(rowDrag.id);if(el)el.classList.add('ol-lift');}
  const el=rowEl(rowDrag.id);if(el)el.style.transform=`translateY(${dy}px)`;
  const{overIdx,before}=rowAtClientY(e.clientY);rowDrag.overIdx=overIdx;rowDrag.before=before;
  document.querySelectorAll('#seqOrder .ol-row').forEach(x=>x.classList.remove('ol-over-top','ol-over-bot'));
  if(overIdx!==rowDrag.idx){const overEl=rowEl(seqSongs[overIdx].id);if(overEl)overEl.classList.add(before?'ol-over-top':'ol-over-bot');}
});
document.addEventListener('pointerup',()=>{
  if(!rowDrag)return;const rd=rowDrag;rowDrag=null;document.body.style.cursor='';
  const el=rowEl(rd.id);if(el){el.classList.remove('ol-lift');el.style.transform='';}
  document.querySelectorAll('#seqOrder .ol-row').forEach(x=>x.classList.remove('ol-over-top','ol-over-bot'));
  if(!rd.moved)return;
  const moved=seqSongs[rd.idx];let target=rd.overIdx+(rd.before?0:1);seqSongs.splice(rd.idx,1);if(rd.idx<target)target--;target=Math.max(0,Math.min(seqSongs.length,target));seqSongs.splice(target,0,moved);
  seqStop();seqPos=0;renderSeq();seqPersist();
});

function renderSchedule(){
  const a=A(),al=AL();
  content.innerHTML=`<div class="ws-head"><div class="eyebrow">${al.title}</div><div class="view-title">Release schedule</div><div class="ws-sub">Every deadline, working back from release day. Set your release date and albumap fills in the milestones for you.</div></div>
  <div class="gen-box"><div style="flex:1"><div class="gt">↩ Reverse-timeline generator</div><div class="gd">Enter a release date — we back-build masters, artwork, pre-saves and merch deadlines automatically.</div></div>
    <input type="date" id="relDate" value="2026-12-05"><button class="solid-btn" onclick="genTimeline()">Generate</button></div>
  <div class="timeline-v" id="schedTimeline"></div>`;
  drawSchedule(al.schedule);
}
function drawSchedule(sched){
  document.getElementById('schedTimeline').innerHTML=sched.map((s,i)=>{const col=s.tag==='done'?'var(--green)':s.tag==='due'?'var(--amber)':'var(--accent)';return `<div class="tl-row"><div class="tl-mark"><div class="tl-dot" style="background:${col}"></div>${i<sched.length-1?'<div class="tl-line"></div>':''}</div><div class="tl-card"><div class="d"><div class="mo">${s.mo}</div><div class="dy">${s.dy}</div><div class="yr">${s.yr}</div></div><div class="body"><div class="tt">${s.t}</div><div class="ds">${s.d}</div></div><span class="tag ${s.tag}">${s.tag==='done'?'Done':s.tag==='due'?'Due soon':'Upcoming'}</span></div></div>`;}).join('');
}
function genTimeline(){
  const v=document.getElementById('relDate').value;if(!v){alert('Pick a release date first.');return;}
  const rel=new Date(v+'T00:00:00');const MO=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  const mk=(weeksBefore,t,d)=>{const dt=new Date(rel);dt.setDate(dt.getDate()-weeksBefore*7);return{mo:MO[dt.getMonth()],dy:String(dt.getDate()).padStart(2,'0'),yr:String(dt.getFullYear()),t,d,tag:'up'};};
  const sched=[mk(10,"Masters to mastering engineer","Final mixes bounced, WAV 24/48"),mk(8,"Artwork final to distributor","3000×3000 cover, credits locked"),mk(6,"Merch proofs due","Tee + vinyl jacket approval"),mk(6,"Distribution upload","Deliver to DSPs with 4-week lead"),mk(4,"Pre-save campaign live","Lead single + socials"),mk(1,"Vinyl arrives / press kit","Final checks before release"),{mo:MO[rel.getMonth()],dy:String(rel.getDate()).padStart(2,'0'),yr:String(rel.getFullYear()),t:"Release day",d:"All DSPs + physical ship",tag:'up'}];
  const al=AL();al.schedule=sched;drawSchedule(sched);
  fetch('/api/schedule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({albumId:al.id,schedule:sched,releaseDate:v})}).catch(()=>{});
}

const ART_LABELS=["Front cover","Back cover","Inside / gatefold","Vinyl label","Insert","Sticker","Poster","Social post","Single cover","Alt cover"];
function artTile(m){
  const isSong=!!m.song;
  const cap=esc(m.label||(isSong?'Single':'Untitled'));
  return `<div class="exp-tile ${isSong?'is-single':''}" ${isSong?'':`draggable="true" ondragstart="artDragStart(event,'${m.id}')"`} title="${isSong?'Open song':'Open / edit'}" onclick="${isSong?`nav({view:'songs',artistId:'${route.artistId}',albumId:'${route.albumId}',songId:'${m.songId}'})`:`openArtwork('${m.id}')`}">${isSong?'<div class="song-badge">Single</div>':''}${m.img?`<img src="${m.img}">`:`<div class="m-drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg><div class="lbl">No image</div></div>`}<div class="cap">${cap}</div></div>`;
}
function renderArtwork(){
  const al=AL();const main=al.artwork||[];const pool=al.artworkPool||[];
  const mainCount=main.filter(x=>!x.song).length;
  content.innerHTML=`<div class="ws-head"><div class="eyebrow">${al.title}</div><div class="view-title">Album artwork</div><div class="ws-sub">Your <b>working art</b> is the tentative main lineup; the <b>pool</b> holds alternates &amp; extras. Drag pieces between them, click any piece to open it large and edit its label, replace, or delete. Single covers from song pages show up here too.</div></div>
  <div class="art-section">
    <div class="art-sec-head">Working art<span class="art-cnt">${mainCount}</span><button class="solid-btn" style="margin-left:auto;padding:8px 15px" onclick="addArtwork(false)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Add artwork</button></div>
    <div class="exp-gallery art-drop" ondragover="artDragOver(event)" ondragleave="this.classList.remove('dragover')" ondrop="artDrop(event,false)">${main.length?main.map(m=>artTile(m)).join(''):'<div class="art-empty">Drop art here, or click “Add artwork”. These are your leading pieces.</div>'}</div>
  </div>
  <div class="art-section">
    <div class="art-sec-head">Art pool<span class="art-cnt">${pool.length}</span><span class="art-sub">alternates &amp; extras</span><button class="ghost-btn" style="margin-left:auto;padding:7px 13px" onclick="addArtwork(true)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Add to pool</button></div>
    <div class="exp-gallery art-drop" ondragover="artDragOver(event)" ondragleave="this.classList.remove('dragover')" ondrop="artDrop(event,true)">${pool.length?pool.map(m=>artTile(m)).join(''):'<div class="art-empty">Drag pieces here to keep them as options without cluttering the working set.</div>'}</div>
  </div>`;
}
function findArt(id){const al=AL();let p=(al.artwork||[]).find(x=>!x.song&&x.id===id);if(p)return p;return (al.artworkPool||[]).find(x=>x.id===id)||null;}
let artDragId=null,artFileTarget=null,artAddPool=false;
function artDragStart(e,id){artDragId=id;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',id);}catch(_){}}
function artDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('dragover');}
function artDrop(e,toPool){e.preventDefault();e.currentTarget.classList.remove('dragover');const id=artDragId||(e.dataTransfer&&e.dataTransfer.getData('text/plain'));artDragId=null;if(id)moveArtwork(id,toPool);}
function moveArtwork(id,toPool){
  const al=AL();const main=al.artwork||[],pool=al.artworkPool||[];
  let piece=main.find(x=>!x.song&&x.id===id)||pool.find(x=>x.id===id);if(!piece)return;
  const inPoolNow=!!piece.pool;if(inPoolNow===!!toPool)return;
  al.artwork=(al.artwork||[]).filter(x=>x!==piece);al.artworkPool=(al.artworkPool||[]).filter(x=>x!==piece);
  piece.pool=!!toPool;
  if(toPool)al.artworkPool.push(piece);else al.artwork.splice(al.artwork.filter(x=>!x.song).length,0,piece);
  renderArtwork();
  fetch('/api/artwork',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'update',id,inPool:!!toPool})}).catch(()=>{});
}
function addArtwork(toPool){artAddPool=!!toPool;artFileTarget='new';document.getElementById('artFileInput').click();}
async function uploadArtwork(f){
  const al=AL();if(!al)return;const localUrl=URL.createObjectURL(f);
  const piece={id:'tmp'+(++uidc),label:'',img:localUrl,pool:artAddPool,key:null};
  if(artAddPool){al.artworkPool=al.artworkPool||[];al.artworkPool.push(piece);}else{al.artwork=al.artwork||[];al.artwork.splice(al.artwork.filter(x=>!x.song).length,0,piece);}
  renderArtwork();
  try{
    const up=await fetch('/api/artwork',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'upload-url',albumId:al.id,name:f.name})}).then(r=>r.json());
    if(!up.ok)throw new Error('url');
    const put=await fetch(up.uploadUrl,{method:'PUT',headers:{'Content-Type':up.contentType},body:f});if(!put.ok)throw new Error('put');
    const cr=await fetch('/api/artwork',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create',albumId:al.id,label:'',key:up.key,inPool:artAddPool})}).then(r=>r.json());
    if(cr&&cr.id){piece.id=cr.id;piece.key=up.key;if(!artAddPool)openArtwork(cr.id);}
  }catch(e){/* local preview stays this session */}

    }catch(err){/* local preview stays this session */}

  const localUrl=URL.createObjectURL(f);
  if(type==='artwork'&&al.artwork[idx])al.artwork[idx].img=localUrl;
  if(type==='merch'&&al.merch[idx])al.merch[idx].img=localUrl;
  render();
  try{
    const up=await fetch('/api/asset-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({albumId:al.id,kind:type,slot:idx,name:f.name})}).then(r=>r.json());
    if(!up.ok)throw new Error('url');
    const put=await fetch(up.uploadUrl,{method:'PUT',headers:{'Content-Type':up.contentType},body:f});
    if(!put.ok)throw new Error('put');
    await fetch('/api/album-asset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({albumId:al.id,kind:type,slot:idx,key:up.key})});
  }catch(err){/* local preview stays this session; will not persist if upload failed */}
});
async function uploadSongArt(f,songId){
  const al=AL();const s=al&&al.songs.find(x=>x.id===songId);if(!s)return;
  const localUrl=URL.createObjectURL(f);s.art=localUrl;
  // mirror into album artwork list (labeled with the song name)
  let entry=al.artwork.find(x=>x.song&&x.songId===songId);
  if(entry)entry.img=localUrl;else al.artwork.push({label:s.t,img:localUrl,song:true,songId});
  const tile=document.querySelector(`.idea-song[data-song="${songId}"] .song-art`);
  if(tile){tile.classList.add('filled');tile.innerHTML=`<img src="${localUrl}"><div class="sa-replace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div>`;}
  try{
    const up=await fetch('/api/song-art',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'upload-url',songId,name:f.name})}).then(r=>r.json());
    if(!up.ok)throw new Error('url');
    const put=await fetch(up.uploadUrl,{method:'PUT',headers:{'Content-Type':up.contentType},body:f});if(!put.ok)throw new Error('put');
    await fetch('/api/song-art',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'set',songId,key:up.key})});
  }catch(e){/* local preview stays this session */}
}
function saveSongMeta(songId,field,value){
  const al=AL();const s=al&&al.songs.find(x=>x.id===songId);if(s)s[field]=value;
  const b={songId};b[field]=value;
  fetch('/api/song-meta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).catch(()=>{});
}

/* ===== audio cleanup on nav ===== */
function stopAllAudio(){if(curAudio){curAudio.pause();curAudio=null;curTid=null;}if(seqPlaying){seqStop();}seqPos=0;}

document.getElementById('scroll').addEventListener('scroll',function(){document.getElementById('topbar').classList.toggle('scrolled',this.scrollTop>10);});
window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());
document.addEventListener('click',e=>{const w=document.getElementById('quickNav');if(w&&!w.contains(e.target))closeNotif();});

/* ===== REAL DATA (Supabase via /api) ===== */
function defaultRoute(){
  if(!artists.length)return{view:'roster'};
  const a0=artists[0],al0=a0.albums[0];
  return al0?{view:'dashboard',artistId:a0.id,albumId:al0.id}:{view:'albums',artistId:a0.id};
}
// Persist the current route so a page refresh returns to the same view/section.
function saveRoute(){try{localStorage.setItem('albumap:route',JSON.stringify(route));}catch(e){}}
function restoreRoute(){
  try{const s=localStorage.getItem('albumap:route');if(!s)return null;const r=JSON.parse(s);if(!r||!r.view)return null;
    if(r.artistId){const a=getArtist(r.artistId);if(!a)return null;if(r.albumId&&!getAlbum(a,r.albumId))return null;}
    return r;
  }catch(e){return null;}
}
async function reloadData(nextRoute){
  try{const res=await fetch('/api/studio-data',{cache:'no-store'});if(res.ok){const d=await res.json();artists=Array.isArray(d.artists)?d.artists:[];}}catch(e){}
  route=nextRoute||restoreRoute()||defaultRoute();hist=[{...route}];hi=0;render();
}
function persistCell(songId,instrument,state){
  fetch('/api/cell',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({songId,instrument,state})}).catch(()=>{});
}
async function createAlbumFlow(artistName){
  let artist,title;
  if(artistName!=null){ // adding an album under an existing artist
    title=(prompt('Album title')||'').trim();if(!title)return;artist=artistName;
  }else{ // "New artist" from the roster — ask the artist first
    artist=(prompt('Artist / band name')||'').trim();if(!artist)return;
    title=(prompt('First album title')||'').trim();if(!title)return;
  }
  const res=await fetch('/api/album',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,artist})});
  if(!res.ok){alert('Could not create the album.');return;}
  const {id}=await res.json();
  await reloadData();
  for(const a of artists){const al=a.albums.find(x=>x.id===id);if(al){nav({view:'dashboard',artistId:a.id,albumId:al.id});break;}}
}
async function renameBand(artistId){
  const a=getArtist(artistId);if(!a)return;
  const nn=(prompt('Band / artist name',a.name)||'').trim();if(!nn||nn===a.name)return;
  const res=await fetch('/api/album',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({renameArtistFrom:a.name,renameArtistTo:nn})});
  if(!res.ok){alert('Could not rename the band.');return;}
  await reloadData({view:'roster'});
  const na=artists.find(x=>x.name===nn);if(na)nav({view:'albums',artistId:na.id});
}
async function renameAlbum(artistId,albumId){
  const a=getArtist(artistId);const al=a&&getAlbum(a,albumId);if(!al)return;
  const nt=(prompt('Album title',al.title)||'').trim();if(!nt||nt===al.title)return;
  const res=await fetch('/api/album',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:albumId,title:nt})});
  if(!res.ok){alert('Could not rename the album.');return;}
  await reloadData({...route});
}
async function addSongFlow(){
  const al=AL();if(!al)return;
  const title=prompt('Song title');if(!title||!title.trim())return;
  const res=await fetch('/api/song',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({albumId:al.id,title:title.trim()})});
  if(!res.ok){alert('Could not add the song.');return;}
  await reloadData({...route}); // reload syncs both the grid and songs views
}
async function deleteSong(id){
  const al=AL();const s=al&&al.songs.find(x=>x.id===id);if(!s)return;
  if(!confirm(`Delete “${s.t}”? This removes its grid cells, files and comments.`))return;
  al.songs=al.songs.filter(x=>x.id!==id);
  if(route.songId===id)route.songId=null;
  render();
  fetch('/api/song?id='+encodeURIComponent(id),{method:'DELETE'}).catch(()=>{});
}
async function inviteMember(){
  const al=AL();if(!al)return;const name=prompt('Invite who? (name)');if(!name||!name.trim())return;
  const res=await fetch('/api/member',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({albumId:al.id,name:name.trim()})});
  if(!res.ok){alert('Could not add member.');return;}
  await reloadData({...route});
}
function curStamp(){return (curAudio&&!curAudio.paused)?fmtT(curAudio.currentTime):'';}
function postComment(songId){
  const inp=document.getElementById('cmt-'+songId);if(!inp)return;const text=inp.value.trim();if(!text)return;
  inp.value='';
  const al=AL();const s=al&&al.songs.find(x=>x.id===songId);
  // Attach to the file currently playing in this song (with its timestamp), else
  // the song's master/first file so the marker lands somewhere sensible.
  let fileSid=null,stamp='';
  if(curTid){const t=findFile(curTid);if(t&&s&&s.files.indexOf(t)>=0){fileSid=t.sid||null;stamp=curStamp();}}
  if(!fileSid&&s&&s.files.length){fileSid=(s.files.find(f=>f.master)||s.files[0]).sid||null;}
  if(s){s.comments.push({who:'You',color:'#FF4D1C',stamp,text,fileSid});route.songId=songId;renderSongList();}
  fetch('/api/comment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({songId,text,stamp,fileId:fileSid})}).catch(()=>{});
}
/* ===== references (artist / song / genre / link / file) ===== */
const REF_TYPES={
  artist:{label:'Artist',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>'},
  song:{label:'Song',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>'},
  genre:{label:'Genre',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 13.4 12 22l-9-9V3h10z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>'},
  link:{label:'Link',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>'},
  file:{label:'File',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'},
  note:{label:'Note',icon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'}
};
function refType(r){return (r&&r.type&&REF_TYPES[r.type])?r.type:'note';}
function refSub(r){const t=refType(r);
  if(t==='song')return r.by?('Song · '+esc(r.by)):'Song';
  if(t==='artist')return 'Artist';
  if(t==='genre')return 'Genre';
  if(t==='link')return esc(r.url||'');
  if(t==='file')return 'File'+(r.url?'':' · uploading…');
  return esc(r.u||'');}
function refRow(songId,r,idx){const t=refType(r);const title=esc(r.title||r.t||'(untitled)');
  const open=(t==='link'&&r.url)?`<a class="ico-btn" href="${esc(r.url)}" target="_blank" rel="noopener" title="Open" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M8 7h9v9"/></svg></a>`
    :(t==='file'&&r.url)?`<a class="ico-btn" href="${esc(r.url)}" target="_blank" rel="noopener" title="Open file" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M5 21h14"/></svg></a>`:'';
  return `<div class="ref-row"><div class="ri ri-${t}">${REF_TYPES[t].icon}</div><div style="flex:1;min-width:0"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</div><div class="ref-sub">${refSub(r)}</div></div>${open}<button class="ico-btn" title="Remove" onclick="removeRef('${songId}',${idx})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>`;
}
function refsBody(s){
  const rows=(s.refs&&s.refs.length)?s.refs.map((r,idx)=>refRow(s.id,r,idx)).join(''):'<div class="empty-note">Artists, songs, genres, links or files you want this to feel like.</div>';
  const menu=['artist','song','genre','link','file'].map(t=>`<button onclick="addRefType('${s.id}','${t}')">${REF_TYPES[t].icon}${REF_TYPES[t].label}</button>`).join('');
  return `${rows}<button class="ghost-btn" style="margin-top:10px;width:100%;justify-content:center" onclick="toggleRefMenu('${s.id}')">＋ Add reference</button><div class="ref-menu" id="refmenu-${s.id}" style="display:none">${menu}</div>`;
}
function toggleRefMenu(songId,forceClose){const m=document.getElementById('refmenu-'+songId);if(!m)return;m.style.display=(forceClose||m.style.display!=='none')?'none':'';}
function persistRefs(s){const clean=(s.refs||[]).map(r=>r.type==='file'?{type:'file',title:r.title,key:r.key||null}:r);fetch('/api/song-meta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({songId:s.id,refs:clean})}).catch(()=>{});}
function addRefType(songId,type){
  toggleRefMenu(songId,true);
  const al=AL();const s=al&&al.songs.find(x=>x.id===songId);if(!s)return;s.refs=s.refs||[];
  let ref=null;
  if(type==='artist'){const n=(prompt('Artist name')||'').trim();if(!n)return;ref={type,title:n};}
  else if(type==='song'){const n=(prompt('Song title')||'').trim();if(!n)return;const by=(prompt('Artist (optional)')||'').trim();ref={type,title:n,by};}
  else if(type==='genre'){const n=(prompt('Genre')||'').trim();if(!n)return;ref={type,title:n};}
  else if(type==='link'){let u=(prompt('Link URL (https://…)')||'').trim();if(!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;const l=(prompt('Label (optional)')||'').trim();ref={type,title:l||u,url:u};}
  else if(type==='file'){refFileTarget=songId;document.getElementById('refFileInput').click();return;}
  s.refs.push(ref);route.songId=songId;renderSongList();persistRefs(s);
}
function removeRef(songId,idx){const al=AL();const s=al&&al.songs.find(x=>x.id===songId);if(!s)return;s.refs.splice(idx,1);route.songId=songId;renderSongList();persistRefs(s);}
let refFileTarget=null;
async function uploadRefFile(f){
  const songId=refFileTarget;const al=AL();const s=al&&al.songs.find(x=>x.id===songId);if(!s)return;s.refs=s.refs||[];
  const ref={type:'file',title:f.name,key:null,url:URL.createObjectURL(f)};
  s.refs.push(ref);route.songId=songId;renderSongList();
  try{
    const up=await fetch('/api/ref-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({songId,name:f.name})}).then(r=>r.json());
    if(!up.ok)throw new Error('url');
    const put=await fetch(up.uploadUrl,{method:'PUT',headers:{'Content-Type':up.contentType},body:f});if(!put.ok)throw new Error('put');
    ref.key=up.key;persistRefs(s);
  }catch(e){/* local preview stays this session */}
}
function addCredit(songId){
  const who=prompt('Credit — who?');if(!who||!who.trim())return;const role=(prompt('Role (guitar, vox, writing…)')||'').trim();const split=(prompt('Split % (optional, e.g. 40%)')||'').trim();
  const al=AL();const s=al&&al.songs.find(x=>x.id===songId);if(!s)return;
  s.credits.push({who:who.trim(),role,split});route.songId=songId;renderSongList();
  fetch('/api/song-meta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({songId,credits:s.credits})}).catch(()=>{});
}
reloadData();
</script>
